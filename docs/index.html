# Módulo 9 — Gestión de Riesgos Financieros

## Para qué sirve este bloque

El módulo responde a una pregunta concreta: dado que los mercados pueden moverse en tu contra, ¿cómo cuantificas cuánto puedes perder y de qué fuente viene ese riesgo? Cubre tres tipos de riesgo que afectan a cualquier institución financiera —mercado, crédito y liquidez— y para cada uno proporciona tanto el marco teórico como la implementación cuantitativa. El hilo conductor es que cada tipo de riesgo necesita sus propias métricas: usar VaR para riesgo de liquidez o bid-ask spread para riesgo de mercado sería un error conceptual, no solo técnico.

---

## Tema 1: Riesgo de mercado

### La idea central

El **riesgo de mercado** es la pérdida potencial que surge de movimientos adversos en precios de mercado: tipos de interés, tipos de cambio, precios de acciones o materias primas. Las dos métricas dominantes para cuantificarlo son el **VaR** (*Value at Risk*) y el **Expected Shortfall** (ES). Históricamente surgieron de una necesidad práctica: JP Morgan necesitaba un único número que resumiera la exposición diaria de toda la institución.

### Value at Risk (VaR)

El VaR al nivel de confianza $\alpha$ responde a: ¿cuál es la pérdida máxima que no se superará con probabilidad $\alpha$ durante un horizonte temporal dado? Si el VaR diario al 95% es 1M€, hay un 5% de probabilidad de perder más de 1M€ ese día.

Sus tres ingredientes son invariables independientemente del método de cálculo: el **intervalo de confianza** (95% o 99%), el **horizonte temporal** (1 día para trading, 10 días para regulación), y la **desviación típica** de los retornos del portfolio.

El VaR escala con el tiempo según la raíz cuadrada: $\text{VaR}_{n\text{ días}} = \text{VaR}_{1\text{ día}} \times \sqrt{n}$. Esto asume retornos i.i.d., supuesto que rara vez se cumple en periodos de estrés.

### Los tres métodos de cálculo del VaR

**Varianza-covarianza (paramétrico).** Asume que los retornos siguen una distribución normal. La fórmula para un portfolio es:

$$\text{VaR} = V \cdot \sigma_p \cdot Z_\alpha$$

donde $V$ es el valor del portfolio, $\sigma_p = \sqrt{w_1^2\sigma_1^2 + w_2^2\sigma_2^2 + 2\rho w_1 w_2 \sigma_1 \sigma_2}$ es la desviación típica del portfolio, y $Z_\alpha$ es el cuantil de la normal estándar al nivel $\alpha$. En Python: `norm.ppf(1 - conf_level, mean, std)`.

Ventaja: fácil de calcular, requiere pocos datos. Limitación crítica: los retornos financieros tienen colas más gruesas que la normal (*fat tails*), por lo que este método subestima el riesgo en periodos de crisis.

**Simulación histórica.** No asume ninguna distribución. Se toman los retornos históricos del portfolio, se ordenan, y el VaR es el percentil correspondiente al nivel de confianza: si el intervalo es 95%, el VaR es el percentil 5 de los retornos históricos multiplicado por la inversión inicial. En Python: `np.percentile(returns, 5)`.

Ventaja: captura asimetría, colas gruesas y efectos GARCH implícitamente. Limitación: asume que el pasado es representativo del futuro; requiere muestra grande; es computacionalmente intensivo.

**Monte Carlo.** Genera miles de escenarios de retornos aleatorios desde una distribución especificada, calcula la pérdida en cada escenario, y toma el percentil correspondiente. La lógica es la misma que en simulación histórica, pero con datos sintéticos en lugar de históricos. Permite modelar distribuciones no normales y dependencias no lineales.

Ventaja: máxima flexibilidad. Limitación: depende enteramente de cuán bien se especifique la distribución generadora.

### VaR como medida de riesgo coherente

Una medida de riesgo es **coherente** si cumple cuatro axiomas: invarianza a la traslación, subaditividad, homogeneidad positiva y monotonicidad. El VaR **no es coherente** porque viola la **subaditividad**: puede ocurrir que $\text{VaR}(A+B) > \text{VaR}(A) + \text{VaR}(B)$. Esto es conceptualmente problemático porque implica que combinar dos portfolios puede aumentar el riesgo medido, penalizando la diversificación.

### Expected Shortfall (ES)

El **Expected Shortfall** (también llamado CVaR o *Conditional VaR*) resuelve el problema de subaditividad del VaR. ES sí es coherente. Mientras el VaR es un cuantil, el ES es la **media de las pérdidas que superan el VaR**:

$$\text{ES}_\alpha = \mathbb{E}[L \mid L > \text{VaR}_\alpha] = \frac{1}{1-\alpha}\int_\alpha^1 \text{VaR}_u\, du$$

En distribución continua, ES es la media de las pérdidas en la cola. En distribución discreta:

$$\text{ES}_\alpha = \frac{1}{1-\alpha} \sum_n \max(L_n) \cdot P(L_n)$$

El ES paramétrico usa la esperanza de la normal truncada por encima del cuantil $\alpha$. El ES histórico toma la media de todos los retornos que caen por debajo del percentil 5. La diferencia práctica: si el VaR al 95% es 1M€, el ES al 95% podría ser 1.5M€ —dice que, en los días malos, la pérdida media es 1.5M€, no solo que se supera 1M€.

---

## Tema 2: Riesgo de crédito

### La idea central

El **riesgo de crédito** es la probabilidad de que un prestatario no cumpla sus obligaciones de pago. Es el mayor componente del capital económico de la mayoría de los bancos, superando al riesgo de mercado. El objetivo de su gestión es maximizar el retorno ajustado al riesgo manteniendo la exposición crediticia dentro de límites aceptables.

### Los tres componentes del riesgo de crédito

Todo modelo de riesgo de crédito se construye sobre tres variables:

- **PD** (*Probability of Default*): probabilidad de que el prestatario incumpla. Es el componente más difícil de estimar.
- **LGD** (*Loss Given Default*): fracción del crédito que no se recupera si hay impago, entre 0 y 1.
- **EAD** (*Exposure at Default*): importe total expuesto en el momento del impago.

La **pérdida esperada** del enfoque IRB (*Internal Ratings-Based*) de Basilea es:

$$\text{Expected Loss} = \text{EAD} \times \text{LGD} \times \text{PD}$$

### Los Acuerdos de Basilea

**Basilea I (1988):** primer sistema de requerimientos de capital. Clasifica activos por riesgo: 0% para activos libres de riesgo, 20% para préstamos interbancarios, 50% para hipotecas residenciales, 100% para deuda corporativa. Requiere capital mínimo del 8% de los activos ponderados por riesgo.

**Basilea II (1999):** introduce tres pilares — requerimientos mínimos de capital, revisión supervisora y disciplina de mercado. Permite a los bancos usar modelos internos (IRB) para estimar PD, LGD y EAD.

**Basilea III (2010):** respuesta a la crisis de 2007-2008. Introduce ratios adicionales de liquidez (LCR ≥ 100%, ratio de apalancamiento ≥ 3%) y requerimientos de capital de mayor calidad (Tier 1 capital ratio ≥ 4.5%).

### Risk bucketing: segmentación por riesgo

Estimar la PD con un único modelo para todos los clientes produce predicciones pobres porque la distribución del riesgo cambia entre segmentos. El **risk bucketing** agrupa prestatarios con características similares antes de modelar.

El método estándar es **K-means clustering** sobre variables financieras del prestatario. Para determinar el número óptimo de clusters se usan cuatro criterios:

- **Método del codo:** se busca el punto donde la inercia (suma de distancias al centroide) deja de decrecer significativamente.
- **Silhouette score:** mide separación entre clusters. Valor de 1 indica clasificación perfecta; -1 indica clasificación incorrecta. Fórmula: $(x - y) / \max(x, y)$ donde $x$ es distancia intercluster e $y$ distancia intracluster.
- **Calinski-Harabasz (CH):** cociente entre varianza entre-clusters ($SSB$) y varianza intra-cluster ($SSW$), escalado por $N$ y $k$. Mayor valor es mejor.
- **Gap analysis (Tibshirani):** compara la varianza intra-cluster observada con la esperada bajo distribución de referencia nula. Se elige $k$ que maximiza el gap statistic.

### Estimación de la PD: regresión logística

La **regresión logística** es el modelo estándar para predecir la PD porque la variable dependiente es binaria (impago/no impago). Transforma la probabilidad mediante la función logit para que el output esté en $[0, 1]$:

$$\log\frac{p}{1-p} = \beta_0 + \beta_1 x \implies p = \frac{e^{\beta_0 + \beta_1 x}}{1 + e^{\beta_0 + \beta_1 x}}$$

Un problema frecuente en datos de crédito es el **desbalance de clases**: los impagos son mucho menos frecuentes que los pagos correctos. La solución estándar es **SMOTEENN** (*Synthetic Minority Oversampling Technique + Edited Nearest Neighbors*): genera muestras sintéticas de la clase minoritaria y elimina observaciones ambiguas en la frontera de decisión.

La evaluación del modelo se hace con la **curva ROC-AUC** (*Receiver Operating Characteristic - Area Under the Curve*): mide la capacidad del modelo de separar defaults de no-defaults. Un AUC de 1 indica separación perfecta; de 0.5 indica que el modelo no tiene poder predictivo (equivale a lanzar una moneda).

---

## Tema 3: Riesgo de liquidez

### La idea central

El **riesgo de liquidez** es la incapacidad de convertir un activo en efectivo sin incurrir en pérdidas significativas de precio o de tiempo. Fue el gran ignorado antes de 2008: los modelos asumían que los activos siempre tenían compradores. La crisis hipotecaria demostró que en periodos de estrés la liquidez desaparece exactamente cuando más se necesita, creando un círculo vicioso entre liquidez de mercado y liquidez de financiación.

### Las cuatro dimensiones de la liquidez

La liquidez es multidimensional; cada dimensión captura un aspecto diferente y necesita sus propias métricas:

- **Tightness (estrechez):** coste de ejecutar una transacción. A mayor diferencia entre precio de compra y venta (bid-ask spread), menor liquidez.
- **Immediacy (inmediatez):** velocidad a la que se pueden ejecutar órdenes grandes. Malfuncionamiento en clearing o settlement reduce la inmediatez.
- **Depth (profundidad):** abundancia de compradores y vendedores capaces de absorber órdenes de gran tamaño sin mover el precio.
- **Resiliency (resiliencia):** capacidad del mercado de recuperar el precio de equilibrio tras un desequilibrio de órdenes.

### Medidas de liquidez por dimensión

**Basadas en volumen (dimensión: profundidad):**

El **ratio de liquidez** mide cuánto volumen se necesita para inducir un cambio de precio del 1%: $LR = \sum(P \cdot V) / \sum|PC|$. Mayor ratio implica mayor liquidez.

El **ratio Hui-Heubel** compara la variación de precio con el volumen relativo a capitalización: $LHH = (P_{max} - P_{min})/P_{min}$ dividido por $V/(P \times \text{shrout})$. Es aplicable a acciones individuales.

El **turnover ratio** es el ratio de volumen negociado sobre acciones en circulación: $TR = (1/D)\sum V / \sum \text{shrout}$. Alta rotación implica alta liquidez.

**Basadas en coste de transacción (dimensión: tightness e immediacy):**

El **porcentaje de spread cotizado** mide el coste directo de una transacción: $(P_{ask} - P_{bid}) / P_{mid}$.

El **spread efectivo** captura el caso donde las operaciones ocurren fuera de las cotizaciones: $2|P_t - P_{mid}|/P_{mid}$.

El **spread de Roll** usa la autocorrelación serial de cambios de precio como proxy del bid-ask spread implícito: $\text{Roll} = 2\sqrt{-\text{Cov}(\Delta p_t, \Delta p_{t-1})}$.

El **spread Corwin-Schultz** extrae el spread directamente de los precios máximos y mínimos diarios, basándose en que los precios altos son órdenes de compra y los bajos son órdenes de venta.

**Basadas en impacto en precio (dimensión: resiliencia):**

La **medida de iliquidez de Amihud** mide la sensibilidad del retorno al volumen en dólares: $\text{ILLIQ} = (1/D)\sum|R|/V$. Mayor ILLIQ implica mayor impacto de precio por dólar negociado, es decir, menor liquidez.

El **ratio RtoTR de Florackis** mejora a Amihud sustituyendo el volumen en dólares por el turnover ratio, eliminando el sesgo por capitalización: $\text{RtoTR} = (1/D)\sum|R|/TR$.

El **coeficiente de elasticidad del trading (CET)** mide la elasticidad del volumen respecto al precio: $\text{CET} = \%\Delta V / \%\Delta P$. Alta elasticidad implica mayor inmediatez.

**Basadas en impacto de mercado (dimensión: resiliencia):**

Se estima el riesgo idiosincrático de cada activo regresando el retorno sobre el retorno de mercado (CAPM), y luego regresando el cuadrado de los residuos sobre el porcentaje de cambio en volumen. El coeficiente $\gamma_2$ mide cuánto se mueve el precio idiosincrático ante cambios en volumen: mayor $\gamma_2$, menor liquidez.

### Modelización: GMM y GMCM

Con once medidas de liquidez construidas, el problema es que son multimodales (diferentes distribuciones según el régimen de mercado) y correlacionadas. El **Gaussian Mixture Model (GMM)** permite modelar datos con múltiples modos sin asumir una distribución paramétrica única. Identifica clusters probabilísticos: cada observación tiene una probabilidad de pertenecer a cada estado. El estado con mayor probabilidad media representa el régimen de liquidez dominante.

El **Gaussian Mixture Copula Model (GMCM)** extiende el GMM incorporando la estructura de correlación entre medidas mediante una cópula. Es el enfoque más completo porque reconoce que distintas dimensiones de liquidez no son independientes: en periodos de alta volatilidad, se deterioran simultáneamente.

Para interpretar qué medidas definen cada estado, se aplica **PCA sobre los componentes del GMM**: los loadings de cada componente principal identifican qué medidas de liquidez dominan en cada régimen. En periodos de alta liquidez predominan turnover ratio, spread cotizado y medidas de Amihud y Florackis; en periodos de iliquidez, cobran más peso las medidas de bid-ask spread basadas en Rolling windows.

---

## Lo más importante para recordar

1. **VaR paramétrico asume normalidad: eso es su mayor vulnerabilidad.** En crisis, los retornos tienen colas más gruesas. El VaR histórico y Monte Carlo evitan este supuesto pero requieren más datos y cómputo.

2. **VaR no es subaditivo: ES sí lo es.** El ES es la media de las pérdidas en la cola y es la métrica preferida regulatoriamente (Basilea IV migra a ES). Es siempre mayor que el VaR al mismo nivel de confianza.

3. **La pérdida esperada en crédito se descompone en PD × LGD × EAD.** La PD es el componente más difícil de estimar; se modela con regresión logística por segmentos (risk bucketing) para capturar la heterogeneidad entre prestatarios.

4. **El desbalance de clases en crédito es la regla, no la excepción.** Sin corrección (SMOTE, ENN), los modelos predicen siempre la clase mayoritaria (no-default) con alta accuracy pero cero capacidad predictiva. La curva ROC-AUC, no el accuracy, es la métrica relevante.

5. **La liquidez tiene cuatro dimensiones que se comportan diferente según el régimen de mercado.** No existe una única medida de liquidez válida para todos los contextos; el GMM permite identificar qué dimensión es dominante en cada periodo.

6. **Los tres tipos de riesgo interactúan.** Una crisis de liquidez puede convertirse en riesgo de crédito (si una empresa no puede financiarse, incumple sus obligaciones). El riesgo de mercado afecta al valor del colateral que respalda el crédito. Modelarlos de forma aislada subestima el riesgo sistémico.

---

# Módulo 9 — Temas 1 a 12: Gestión de Riesgos Financieros

## Para qué sirve este bloque

Este módulo es la base matemática y estadística del riesgo cuantitativo. No mide riesgos directamente: construye el lenguaje formal —probabilidades, distribuciones, series temporales, regresión— que hace posible modelar pérdidas, calcular VaR, estimar copulas y diseñar pruebas de estrés. Sin este bloque, los modelos de riesgo son cajas negras; con él, se entiende qué supuestos se están asumiendo y cuándo fallan.

Los temas no son independientes: los conceptos de probabilidad (T2–T3) alimentan las distribuciones (T4–T5), que a su vez son la base del VaR (T7) y los modelos de series temporales (T11). El análisis bayesiano (T6) y la regresión (T10) son marcos alternativos de estimación. Los factores de decaimiento (T12) son un refinamiento práctico de casi todo lo anterior.

---

## Tema 1: Matemáticas básicas

### La idea central

Los retornos y los factores de descuento son los bloques de construcción de cualquier modelo financiero. Antes de hacer estadística, hay que decidir cómo medir lo que varía.

### Retornos

Existen dos convenciones para medir la rentabilidad de un activo: el **retorno simple** $R_t = P_t/P_{t-1} - 1$ y el **retorno logarítmico** $r_t = \ln(P_t/P_{t-1})$. La diferencia importa porque los retornos logarítmicos son aditivos en el tiempo:

$$r_{n,t} = r_{1,t} + r_{1,t-1} + \cdots + r_{1,t-n+1}$$

lo que facilita el análisis de series temporales. Los retornos simples, en cambio, son multiplicativos: $(1+R_{n,t}) = (1+R_1)(1+R_2)\cdots$. Para horizontes cortos la diferencia es pequeña; para horizontes largos o retornos extremos, no.

La capitalización continua lleva al límite este razonamiento: cuando el periodo de capitalización tiende a cero, $R_\text{Annual} = e^r - 1$, donde $r$ es el retorno continuo.

### Factores de descuento

El **valor presente** de un pago futuro $V_{t+n}$ se obtiene descontando a la tasa $R$:

$$V_t = \frac{V_{t+n}}{(1+R)^n}$$

Esta fórmula es la base de la valoración de bonos, opciones y cualquier instrumento con flujos futuros.

### Series geométricas y combinatoria

Una **serie geométrica infinita** $\sum_{i=0}^\infty \delta^i = \frac{1}{1-\delta}$ (para $|\delta|<1$) aparece en los factores de decaimiento (T12). La **combinatoria** $C(n,k) = \frac{n!}{k!(n-k)!}$ es la base de la distribución binomial (T4).

---

## Tema 2: Probabilidades

### La idea central

La probabilidad es el lenguaje para hablar de incertidumbre. Este tema establece las definiciones operativas que se usan en toda la gestión de riesgos.

### Variables aleatorias discretas y continuas

Una **variable aleatoria discreta** toma un conjunto contable de valores, cada uno con una probabilidad $p_i$ tal que $\sum p_i = 1$. Una **variable aleatoria continua** tiene una **función de densidad de probabilidad** (PDF, *probability density function*) $f(x)$ que satisface $\int f(x)\,dx = 1$. La probabilidad de que $X$ caiga en un intervalo es el área bajo la PDF en ese intervalo.

La **función de distribución acumulada** (CDF, *cumulative distribution function*) $F(a) = P[X \leq a]$ resume toda la información probabilística en una función monótona creciente de 0 a 1. El VaR se lee directamente como un cuantil de esta función.

### Eventos independientes y probabilidad condicional

Dos eventos son **mutuamente excluyentes** si no pueden ocurrir simultáneamente: $P[A \cup B] = P[A] + P[B]$. Son **independientes** si la ocurrencia de uno no modifica la probabilidad del otro: $P[A \cap B] = P[A] \cdot P[B]$.

La **probabilidad condicional** $P[A|B] = P[A \cap B]/P[B]$ mide cuánto cambia la probabilidad de $A$ al saber que $B$ ocurrió. Esta distinción es central en riesgo: durante crisis, activos que parecían independientes resultan fuertemente correlacionados.

---

## Tema 3: Estadística básica

### La idea central

Dado que no se puede observar la distribución completa de los retornos, se estiman sus propiedades a partir de datos. Este tema cubre los estimadores estándar y sus propiedades.

### Media, varianza y desviación típica

La **media** de una variable aleatoria $\mu = E[X]$ mide el valor central esperado. La **varianza** $\sigma^2 = E[(X-\mu)^2]$ cuantifica la dispersión alrededor de esa media. La **desviación típica** $\sigma = \sqrt{\sigma^2}$ tiene las mismas unidades que la variable original y es la medida de riesgo más básica.

Regla clave para combinar variables: $\text{Var}[cX] = c^2 \text{Var}[X]$, y $E[X^2] \neq (E[X])^2$ en general —la varianza nunca es cero salvo que la variable sea constante.

### Covarianza, correlación y cobertura

La **covarianza** $\sigma_{XY} = E[(X-\mu_X)(Y-\mu_Y)]$ mide si dos variables se mueven juntas. La **correlación** $\rho_{XY} = \sigma_{XY}/(\sigma_X \sigma_Y)$ normaliza esa medida al intervalo $[-1, 1]$, haciendo comparable la dependencia entre pares de activos.

La varianza de un **portfolio** de dos activos $A$ y $B$ es:

$$\sigma_P^2 = \sigma_A^2 + h^2\sigma_B^2 + 2h\rho_{AB}\sigma_A\sigma_B$$

El ratio de cobertura óptimo que minimiza esta varianza es:

$$h^* = -\rho_{AB}\frac{\sigma_A}{\sigma_B}$$

Esta fórmula conecta directamente con la gestión práctica: dice cuántas unidades de $B$ hay que vender por cada unidad de $A$ para minimizar la varianza del portfolio.

### Momentos, asimetría y curtosis

Los **momentos** de orden superior caracterizan la forma de la distribución más allá de la media y la varianza. La **asimetría** (*skewness*) es el momento central estandarizado de orden 3: valores negativos indican una cola larga a la izquierda (pérdidas extremas más probables de lo que sugiere la normal). La **curtosis** es el momento de orden 4: valores superiores a 3 (*fat tails* o colas gruesas) indican más eventos extremos de los que predice la normal.

La **coscewness** y la **cokurtosis** son extensiones multivariantes: miden si los retornos extremos de dos activos tienden a coincidir. Su problema práctico es que generan un número muy elevado de estadísticos cruzados, lo que dificulta su uso en portfolios grandes.

### BLUE

El **estimador BLUE** (*Best Linear Unbiased Estimator*) es el estimador lineal de varianza mínima entre todos los insesgados. La relevancia práctica: bajo los supuestos de OLS (T10), el estimador de mínimos cuadrados es BLUE.

---

## Tema 4: Distribuciones

### La idea central

Las distribuciones paramétricas son modelos compactos para la incertidumbre: en lugar de almacenar miles de observaciones, se estiman dos o tres parámetros y se trabaja con la distribución completa. El coste es que si el modelo paramétrico es incorrecto, las estimaciones de riesgo pueden fallar sistemáticamente.

### Distribuciones clave

La **distribución uniforme** asigna probabilidad igual a todos los valores en $[b_1, b_2]$. Es el punto de partida de la simulación Monte Carlo: se genera una uniforme estándar y se transforma.

La **distribución de Bernoulli** modela un resultado binario (impago/no impago, subida/bajada). La **distribución binomial** extiende esto a $n$ ensayos independientes: $P[K=k] = C(n,k)p^k(1-p)^{n-k}$. Es la base del backtesting del VaR: si el modelo es correcto al 99%, el número de excepciones en $n$ días sigue una binomial con $p=0.01$.

La **distribución de Poisson** $P[X=n] = e^{-\lambda}\lambda^n/n!$ modela el número de eventos raros por unidad de tiempo (defaults, saltos en precios). El parámetro $\lambda$ es simultáneamente la media y la varianza.

La **distribución normal** $N(\mu, \sigma^2)$ es el pilar del riesgo cuantitativo clásico. Su PDF es simétrica y completamente determinada por media y varianza. Su principal limitación para riesgo: subestima la probabilidad de eventos extremos (colas más delgadas que las observadas en mercados).

La **distribución lognormal** modela precios (no retornos): si $r_t \sim N(\mu, \sigma^2)$, entonces $P_t = P_{t-1} e^{r_t}$ sigue una lognormal. Garantiza que los precios sean positivos.

El **teorema central del límite** justifica el uso de la normal: la suma de $n$ variables independientes con media y varianza finitas converge en distribución a una normal cuando $n \to \infty$, independientemente de la distribución original.

La **distribución $\chi^2$** con $k$ grados de libertad es la suma de $k$ normales estándar al cuadrado. La **t de Student** surge de dividir una normal estándar por la raíz cuadrada de una $\chi^2$ normalizada; tiene colas más gruesas que la normal y se usa cuando la varianza es estimada, no conocida. La **distribución F** es el cociente de dos $\chi^2$ normalizadas; aparece en los tests de hipótesis sobre varianzas en regresión.

Las **distribuciones de mezcla** combinan dos o más distribuciones con pesos: pueden reproducir bimodalidad o colas gruesas sin asumir una forma paramétrica simple, a costa de añadir parámetros.

---

## Tema 5: Distribuciones multivariantes y cópulas

### La idea central

El riesgo de un portfolio depende no solo de la distribución marginal de cada activo sino de cómo se mueven conjuntamente. Las distribuciones multivariantes y las cópulas son las herramientas para modelar esa dependencia.

### Distribuciones multivariantes

La extensión natural de la normal univariante es la **normal multivariante**, caracterizada por un vector de medias y una matriz de covarianzas. La correlación captura la dependencia lineal, pero no la no-lineal: dos activos con correlación cero pueden ser estadísticamente dependientes.

### Cópulas

Una **cópula** es una función que une distribuciones marginales arbitrarias en una distribución conjunta, separando la estructura de dependencia de las distribuciones individuales. Formalmente, dado el teorema de Sklar, cualquier distribución conjunta puede descomponerse en sus marginales y una cópula.

La **cópula de Clayton** captura dependencia en la cola inferior (pérdidas conjuntas): dos activos pueden tener correlación baja en mercados normales pero alta dependencia cuando ambos caen. La **cópula de Frank** es más simétrica. La ventaja de las cópulas es su flexibilidad; el inconveniente es que la estimación y la interpretación son matemáticamente exigentes, y su uso masivo en CDOs durante 2006-2008 mostró que parametrizaciones incorrectas generan estimaciones de riesgo catastróficamente optimistas.

---

## Tema 6: Análisis bayesiano

### La idea central

El enfoque bayesiano trata los parámetros desconocidos como variables aleatorias con una distribución de probabilidad, en lugar de valores fijos a estimar. Esto permite incorporar información previa y actualizar creencias con datos nuevos de manera formal.

### Teorema de Bayes

$$P[A|B] = \frac{P[B|A] \cdot P[A]}{P[B]}$$

En notación bayesiana: **posterior** = (likelihood × prior) / evidencia. El **prior** $P[A]$ recoge la creencia antes de ver los datos. La **likelihood** $P[B|A]$ mide cuán probable es la evidencia dado el modelo. El **posterior** $P[A|B]$ actualiza la creencia tras observar los datos.

La fuente del prior es el mayor punto de controversia: puede venir de datos históricos, de opinión experta o de una distribución no informativa. Cuando el prior es una distribución Beta y los datos son ensayos de Bernoulli, el posterior también es Beta —esto se llama **distribución conjugada** y hace el cálculo tratable.

### Redes bayesianas

Una **red bayesiana** representa la estructura causal entre variables con un grafo dirigido. Cada nodo tiene una distribución condicional dados sus padres. La ventaja práctica es que es más fácil obtener probabilidades condicionales de expertos que probabilidades conjuntas. En riesgo financiero, se usan para modelar cadenas de eventos (burbuja inmobiliaria → caída MBS → quiebra bancaria → caída de bolsa) con datos escasos.

### Bayesianos vs frecuentistas

Los **frecuentistas** tratan los parámetros como constantes fijas y usan la frecuencia relativa de eventos para estimarlos. Los **bayesianos** asignan distribuciones de probabilidad a los parámetros. La diferencia práctica: los intervalos de confianza frecuentistas no son intervalos de probabilidad sobre el parámetro; los intervalos creíbles bayesianos sí lo son.

---

## Tema 7: Tests de hipótesis e intervalos de confianza

### La idea central

Estimar un parámetro puntualmente no basta: hay que cuantificar la incertidumbre de la estimación. Este tema conecta directamente con el VaR, que es esencialmente un cuantil estimado con cierta confianza.

### Media y varianza muestrales como variables aleatorias

La **media muestral** $\hat{\mu}$ es en sí misma una variable aleatoria: tiene media $\mu$ y varianza $\sigma^2/n$. La **varianza muestral** $\hat{\sigma}^2$ con denominador $n-1$ es insesgada. La versión estandarizada $t = (\hat{\mu} - \mu) / (\hat{\sigma}/\sqrt{n})$ sigue una distribución $t$ de Student con $n-1$ grados de libertad, lo que permite construir intervalos de confianza sin conocer $\sigma$.

La **desigualdad de Chebyshev** proporciona un límite de probabilidad sin asumir ninguna distribución: $P[|X - \mu| \geq n\sigma] \leq 1/n^2$. Es menos precisa que asumir normalidad, pero más robusta.

### Value at Risk (VaR)

El **VaR** al nivel de confianza $\alpha$ es la pérdida máxima esperada en un horizonte dado, con probabilidad $1-\alpha$. Formalmente es el cuantil $\alpha$ de la distribución de pérdidas. Si el VaR diario al 99% es 10M€, significa que en el 99% de los días las pérdidas no superarán 10M€.

Ventajas: un único número, fácil de comunicar, ampliamente adoptado por reguladores (Basilea). Limitaciones sustanciales: no dice nada sobre la magnitud de las pérdidas en el 1% de los casos (**no captura la forma de la cola**), puede incentivar a concentrar riesgo justo por debajo del umbral, y no es **subaditivo** en general —el VaR del portfolio puede ser mayor que la suma de los VaR individuales, lo que viola la lógica de la diversificación.

El **backtesting** comprueba si el modelo VaR es consistente con los datos: al 99%, se esperan aproximadamente $0.01 \times n$ excepciones en $n$ días. El número de excepciones sigue una distribución binomial, lo que permite hacer tests formales. Los datos de 2007 mostraron que los modelos de los grandes bancos subestimaron sistemáticamente las excepciones (Bank of America: 14 excepciones observadas vs 2.6 esperadas).

---

## Tema 8: Álgebra matricial

### La idea central

Los portfolios son vectores, las covarianzas son matrices. El álgebra matricial es la sintaxis de la gestión de riesgos multivariante.

### Operaciones básicas

Las operaciones matriciales —suma, producto, transpuesta, inversa— permiten expresar en forma compacta sistemas de ecuaciones que de otro modo serían inmanejables. La fórmula de varianza del portfolio $\sigma_P^2 = \mathbf{w}'\Sigma\mathbf{w}$ (donde $\mathbf{w}$ es el vector de pesos y $\Sigma$ la matriz de covarianzas) es el ejemplo canónico.

### Matrices de transición

Una **matriz de transición** $T$ recoge las probabilidades de pasar de un estado a otro en un periodo. En riesgo de crédito, los estados son calificaciones crediticias (A, B, C, D=default). La probabilidad de transición a $n$ periodos es $T^n$: multiplicar la matriz por sí misma $n$ veces. Permite estimar la probabilidad de que un bono con rating A llegue a impago en 5 años.

### Descomposición de Cholesky y Monte Carlo

Para simular variables correlacionadas, se necesita descomponer la matriz de covarianzas $\Sigma = LL'$ (descomposición de **Cholesky**). El vector de variables correlacionadas se obtiene como $C = L\Phi$, donde $\Phi$ es un vector de normales estándar independientes. Esto es el motor de cualquier simulación Monte Carlo multivariante.

---

## Tema 9: Espacios vectoriales

### La idea central

Los rendimientos de activos financieros tienen estructura de espacio vectorial: se pueden descomponer en direcciones independientes (**componentes principales**) que explican la mayor parte de la varianza. Esto reduce dimensionalidad y facilita la interpretación del riesgo.

### Análisis de componentes principales (PCA)

El **PCA** (*Principal Component Analysis*) transforma un conjunto de variables correlacionadas en componentes ortogonales (no correlacionados) ordenados de mayor a menor varianza explicada. En la curva de tipos de interés, los tres primeros componentes principales corresponden a desplazamiento paralelo (*shift*), inclinación (*tilt*) y curvatura (*twist*) de la curva: con solo tres factores se explica más del 95% de los movimientos históricos. En renta variable global, los primeros componentes capturan el factor de mercado global y efectos sectoriales.

La aplicación práctica en riesgo: en lugar de modelar $n$ tipos de interés correlacionados, se modelan 3 factores independientes, lo que simplifica enormemente la estimación y la simulación.

---

## Tema 10: Regresión lineal

### La idea central

La regresión descompone la variación de un activo en una parte explicada por factores sistemáticos y una parte idiosincrática. Esta descomposición es la base de los modelos de factor y las pruebas de estrés.

### OLS y sus supuestos

La regresión por **mínimos cuadrados ordinarios** (OLS, *Ordinary Least Squares*) estima $\beta$ minimizando la suma de residuos al cuadrado:

$$\hat{\beta} = (X'X)^{-1}X'Y$$

Los supuestos clave son: linealidad, $E[\varepsilon|X]=0$ (exogeneidad), $\text{Var}[\varepsilon|X]=\sigma^2$ (homocedasticidad) y $\text{Cov}[\varepsilon_i, \varepsilon_j]=0$ (no autocorrelación). Bajo estos supuestos, OLS es BLUE.

El ratio de cobertura óptimo $h^* = -\rho_{AB}\sigma_A/\sigma_B$ del T3 se obtiene directamente como el coeficiente de la regresión de los retornos de $A$ sobre los de $B$: OLS cancela sistemáticamente el riesgo sistemático.

### Modelos de factor

En la **regresión multivariante** $Y = X\beta + \varepsilon$, los regresores son factores de riesgo (mercado, sector, tipo de cambio). La varianza del portfolio se descompone en:

$$\sigma_\text{portfolio}^2 = \beta^2 \sigma_\text{factor}^2 + \sigma_\varepsilon^2$$

La ventaja es que $\beta$ (la exposición al factor) es aditiva entre activos, lo que permite agregar riesgo de forma consistente en un portfolio. El **stress testing** aplica shocks a los factores y observa el impacto en el portfolio; la limitación es que asume linealidad, que puede fallar en eventos extremos.

---

## Tema 11: Modelos de series temporales

### La idea central

Los precios y retornos financieros no son independientes en el tiempo. Modelar esa dependencia temporal es imprescindible para estimar la volatilidad futura y diseñar modelos de riesgo dinámicos.

### Random walk y drift-diffusion

Un **random walk** es una serie donde cada incremento es ruido blanco: $x_t = x_{t-1} + \varepsilon_t$ con $E[\varepsilon_t]=0$ y varianza constante. La varianza crece linealmente con el tiempo: $\text{Var}[x_t|x_0] = t\sigma^2$. El modelo de **drift-diffusion** añade una tendencia constante $\alpha$: $p_t = p_{t-1} + \alpha + \varepsilon_t$. Estos son los modelos de precios más simples; el modelo de Black-Scholes es su versión en tiempo continuo.

### Autoregresión y reversión a la media

El modelo **AR(1)** es $r_t = \alpha + \lambda r_{t-1} + \varepsilon_t$. Cuando $|\lambda| < 1$, la serie revierte a la media de largo plazo $\alpha/(1-\lambda)$: los tipos de interés y la volatilidad tienen esta propiedad empíricamente. Cuando $\lambda > 1$, la serie diverge. Cuando $\lambda = 1$, es un random walk.

### GARCH

Los mercados financieros exhiben **heterocedasticidad**: la volatilidad no es constante, se agrupa en el tiempo (periodos de alta volatilidad seguidos de alta volatilidad). El modelo **GARCH(1,1)** modela la varianza condicional:

$$\sigma_t^2 = \omega + \alpha \varepsilon_{t-1}^2 + \beta \sigma_{t-1}^2$$

donde $\varepsilon_{t-1}^2$ es el cuadrado del retorno del día anterior (shock reciente) y $\sigma_{t-1}^2$ es la varianza estimada ayer. Este modelo captura la persistencia de la volatilidad y es el estándar de la industria para estimar volatilidad dinámica.

### Jump-diffusion e modelos de tipo de interés

Los modelos de **jump-diffusion** añaden saltos discretos al proceso continuo: $r_t = \mu + \sigma\varepsilon_t + I_t u_t$, donde $I_t$ es un indicador de salto y $u_t$ la magnitud. Capturan mejor los movimientos bruscos de mercado.

Los modelos de tipo de interés son procesos de reversión a la media con formulaciones específicas: el **Vasicek** tiene reversión lineal y volatilidad constante; el **Cox-Ingersoll-Ross** añade un término $r_t^{1/2}$ que hace la volatilidad proporcional al nivel del tipo (impide tipos negativos).

---

## Tema 12: Factores de decaimiento

### La idea central

En la estimación de media y varianza con datos históricos, las observaciones antiguas pesan igual que las recientes. Los factores de decaimiento son un mecanismo para dar más peso a los datos recientes, capturando mejor el estado actual de los mercados.

### Media y varianza con decaimiento

En lugar de la media simple $\hat{\mu} = \frac{1}{n}\sum x_t$, se usa la media con pesos exponenciales:

$$\hat{\mu}_t = (1-\delta)x_t + \delta\hat{\mu}_{t-1}$$

donde $\delta \in (0,1)$ es el factor de decaimiento: cuanto más cercano a 1, más lento el olvido. El **half-life** es el número de periodos en que el peso de una observación se reduce a la mitad: $h = \ln(0.5)/\ln(\delta)$.

La varianza con decaimiento sigue la misma lógica: $\hat{\sigma}_t^2 = (1-\delta)(r_t - \hat{\mu}_t)^2 + \delta\hat{\sigma}_{t-1}^2$, que puede verse como un GARCH restringido.

### Mínimos cuadrados ponderados y Hybrid VaR

Los **mínimos cuadrados ponderados** (WLS, *Weighted Least Squares*) aplican la matriz de pesos $W$ en la estimación de regresión: $\tilde{\beta} = (X'WX)^{-1}X'WY$. Las observaciones recientes reciben mayor peso, lo que hace los coeficientes más sensibles a cambios estructurales.

El **Hybrid VaR** combina la simulación histórica (que reproduce colas gruesas, asimetría y autocorrelación sin asumir una distribución) con factores de decaimiento (que dan más relevancia a los datos recientes). Es el compromiso estándar en la práctica: no paramétrico en la forma de la distribución, pero adaptativo en el tiempo.

---

## Lo más importante para recordar

1. **Los retornos logarítmicos son aditivos en el tiempo; los simples no.** Esto hace los log-retornos más manejables para modelar series temporales, pero la diferencia solo es relevante para horizontes largos o retornos grandes.

2. **El VaR es un cuantil, no una pérdida máxima.** Dice que con probabilidad $1-\alpha$ las pérdidas no superarán cierto nivel; no dice nada sobre qué pasa en el otro $\alpha$%. El Expected Shortfall (ES) es la métrica que sí captura el riesgo de cola.

3. **Correlación no implica independencia, y correlación cero no implica independencia.** Las cópulas existen precisamente para modelar dependencia no lineal, que es la que aparece en crisis.

4. **La volatilidad agrupa en el tiempo (GARCH).** Usar una volatilidad histórica estática subestima el riesgo en periodos de alta volatilidad y lo sobreestima cuando el mercado está tranquilo. El factor de decaimiento y GARCH son las soluciones prácticas.

5. **Los supuestos de OLS son restrictivos.** Homocedasticidad, no autocorrelación y exogeneidad rara vez se cumplen en datos financieros. Violarlos no invalida necesariamente el modelo, pero sí invalida los errores estándar y los tests de hipótesis derivados.

6. **El análisis bayesiano y el frecuentista no son rivales en la práctica: son complementarios.** El prior bayesiano permite incorporar conocimiento experto cuando los datos son escasos (riesgo de crédito, riesgo operacional); el enfoque frecuentista es más robusto cuando los datos son abundantes y el prior difícil de justificar.

---

# Módulo 10 — Teoría del Valor Extremo (EVT)

## Para qué sirve este bloque

La estadística clásica se centra en el comportamiento promedio de una serie. Los modelos de riesgo basados en distribución normal estiman bien la media y la varianza, pero sistemáticamente subestiman la probabilidad de eventos extremos porque la normal tiene colas demasiado delgadas respecto a los datos financieros reales. La **Teoría del Valor Extremo** (EVT) resuelve exactamente ese problema: en lugar de modelar toda la distribución, modela solo las colas, donde ocurren las pérdidas graves.

El módulo es la continuación natural del Módulo 9: si el VaR paramétrico falla porque asume normalidad, EVT proporciona la herramienta para calcular un VaR más preciso en el extremo de la distribución sin ese supuesto.

Ilustración del problema: retornos mensuales de bonos corporativos A-rated (1980-2008). La peor observación fue -10.84%. Con distribución normal, la probabilidad de un retorno así en 30 años es 0.00008%. Con EVT, es 1.4% — más de 16.000 veces mayor. El evento ocurrió en la muestra; la normal lo consideraba imposible en diez milenios.

---

## Tema 1: Los dos marcos de EVT

### La idea central

EVT no es un modelo único: es una familia de resultados teóricos que garantizan que, bajo ciertas condiciones, los valores extremos de cualquier distribución convergen a una de solo tres distribuciones posibles. El resultado es válido independientemente de cuál sea la distribución subyacente de los datos.

### Marco 1: Block Maximum (máximos por bloque)

Se divide la serie de $T$ observaciones en $m$ bloques de longitud $n$ ($m \times n = T$) y se toma el máximo de cada bloque: $M_k = \max(y_{n(k-1)+1}, \ldots, y_{nk})$. El resultado teórico (Fisher-Tippett 1928, Gnedenko 1943) es que la distribución de los máximos normalizados converge a una **distribución generalizada de valores extremos (GEV)**, que engloba tres casos según el parámetro de forma $\xi$:

- $\xi > 0$: **Fréchet** — colas gruesas. Es la distribución relevante en finanzas, porque los retornos son leptocúrticos. Engloba como caso especial la distribución t de Student.
- $\xi = 0$: **Gumbel** — colas de grosor medio, decaimiento exponencial. Engloba la normal y la log-normal.
- $\xi < 0$: **Weibull** — colas cortas con punto final finito; la PDF es exactamente cero más allá de ese punto.

La CDF unificada de la GEV es:

$$H_{\xi,\mu,\sigma}(y_t) = \begin{cases} \exp\left[-(1 + \xi(y_t-\mu)/\sigma)^{-1/\xi}\right] & \text{si } \xi \neq 0 \\ \exp\left[-\exp(-(y_t-\mu)/\sigma)\right] & \text{si } \xi = 0 \end{cases}$$

donde $\mu$ es el parámetro de localización, $\sigma$ es el de escala, y $\xi$ es el de forma (determina el grosor de las colas).

El **problema práctico** del enfoque de bloques es la ineficiencia: si hay varios extremos en un bloque, solo se usa el máximo y el resto se descarta. Hay además un trade-off: bloques largos → menos sesgo pero más varianza; bloques cortos → menos varianza pero más sesgo.

### Marco 2: Peaks Over Threshold (POT)

Es el enfoque preferido en la práctica. Se especifica un umbral $U$ y se modelan las excedencias: $\tilde{y}_t = y_t - U \mid y_t > U$. Cuando $U \to \infty$, la distribución de las excedencias normalizadas converge a la **distribución generalizada de Pareto (GPD)**:

$$G_{\xi,\sigma}(\tilde{y}_t) = \begin{cases} 1 - (1 + \xi \tilde{y}_t/\sigma)^{-1/\xi} & \text{si } \xi \neq 0 \\ 1 - \exp(-\tilde{y}_t/\sigma) & \text{si } \xi = 0 \end{cases}$$

Los tres casos (Fréchet, Gumbel, Weibull en block maximum) corresponden en el POT a las distribuciones **Pareto ordinaria, exponencial y beta**, respectivamente. El parámetro $\xi$ es el mismo en ambos marcos, lo que permite transferir estimaciones entre los dos enfoques.

**Elección del umbral $U$:** es el punto crítico del enfoque POT. Si $U$ es demasiado bajo, observaciones no extremas se clasifican como extremas → sesgo en los parámetros. Si $U$ es demasiado alto, quedan muy pocas observaciones en la cola → alta varianza de las estimaciones. La solución práctica más habitual es estimar los parámetros para valores crecientes de $U$ hasta que los estimados se estabilicen.

---

## Tema 2: Estimación de parámetros

### Estimación por máxima verosimilitud (ML)

La PDF de las excedencias sobre el umbral (para $\xi \neq 0$) es:

$$g_{\xi,\sigma}(\tilde{y}_t) = \frac{1}{\sigma}\left(1 + \frac{\xi \tilde{y}_t}{\sigma}\right)^{-(1/\xi + 1)}$$

La log-verosimilitud conjunta para $N_U$ observaciones sobre el umbral es:

$$\text{LLF}(\xi, \sigma) = -N_U \ln(\sigma) - \left(\frac{1}{\xi} + 1\right)\sum_{i=1}^{N_U} \ln\left(1 + \frac{\xi \tilde{y}_i}{\sigma}\right)$$

Siempre que $\xi > -0.5$, los estimadores ML son consistentes y asintóticamente normales. Sin embargo, **no existe solución analítica**: hay que usar un optimizador numérico (en Python, `scipy.optimize.minimize` con Nelder-Mead). Aplicado a datos del S&P500 con umbral $-0.025$, los parámetros estimados son $\hat{\xi} \approx 0.388$ y $\hat{\sigma} \approx 0.0075$.

### Estimador de Hill (no paramétrico)

Más simple que ML. Aplicable solo al caso de colas gruesas (Fréchet, $\xi > 0$). Se ordenan las excedencias de mayor a menor: $\tilde{y}_{(1)} \geq \tilde{y}_{(2)} \geq \cdots \geq \tilde{y}_{(T)}$. El estimador de Hill es:

$$\hat{\xi} = \frac{1}{k-1} \sum_{i=1}^{k-1} \left[\ln(\tilde{y}_{(i)}) - \ln(\tilde{y}_{(k)})\right]$$

donde $k$ es el número de observaciones clasificadas como extremas. Intuitivamente, promedia los logaritmos de los ratios entre valores extremos consecutivos: estima la velocidad a la que decae la cola. El **Hill plot** representa $\hat{\xi}$ frente a $k$ y se elige el menor $k$ para el que el estimado se estabiliza.

### Estimadores de Pickands y De Haan-Resnick

Dos variantes alternativas del enfoque no paramétrico:

$$\hat{\xi}_{\text{Pickands}} = \frac{1}{\ln 2} \ln\left(\frac{\tilde{y}_{(k)} - \tilde{y}_{(2k)}}{\tilde{y}_{(2k)} - \tilde{y}_{(4k)}}\right)$$

$$\hat{\xi}_{\text{De Haan-Resnick}} = \frac{\ln(\tilde{y}_{(1)}) - \ln(\tilde{y}_{(k)})}{\ln(k)}$$

Pickands es consistente y asintóticamente normal pero menos eficiente que Hill. Una corrección del sesgo de muestra pequeña (Huisman et al. 2001) consiste en regresar las estimaciones de $\xi$ sobre una constante y el valor de $k$ utilizado; el intercepto de esa regresión es el estimado corregido $\hat{\xi}$ que corresponde al límite cuando $k \to 0$.

### Estimación del parámetro de escala $\sigma$

Una vez estimado $\xi$ por un método no paramétrico, $\sigma$ se puede obtener: (a) sustituyendo $\hat{\xi}$ en la log-verosimilitud y optimizando solo sobre $\sigma$; o (b) usando la fórmula analítica que existe bajo el supuesto Fréchet (Brooks et al. 2005).

---

## Tema 3: VaR con EVT

### La idea central

Los tres métodos estándar de VaR (paramétrico normal, histórico y Monte Carlo) fueron cubiertos en el Módulo 9. EVT añade un cuarto método que es más preciso en el extremo profundo de la cola porque usa explícitamente la forma de esa cola, en lugar de extrapolar desde el centro de la distribución.

### VaR delta-normal y VaR histórico (referencia)

**Delta-normal:** $\text{VaR}_{\text{normal}} = \sigma Z_\alpha$. Usa la desviación típica de toda la muestra y un cuantil de la normal estándar. Simple pero subestima el riesgo en las colas.

**Histórico:** ordena los retornos y toma el percentil correspondiente: `data['ret'].quantile(0.05)`. No asume distribución pero usa un único punto de la distribución empírica e ignora toda la información de la forma de la cola.

En datos del S&P500: VaR 99% histórico = -2.60%, VaR 99% normal = -2.21%. El histórico es mayor en valor absoluto porque capta las colas gruesas que la normal no puede.

### VaR con el estimador de Hill

$$\text{VaR}_{\text{Hill}} = \tilde{y}_{(k)} \cdot \left(\frac{N}{N_U} \alpha\right)^{-\hat{\xi}}$$

donde $\tilde{y}_{(k)}$ es la observación en el umbral, $N$ es el tamaño total de la muestra, $N_U$ es el número de observaciones sobre el umbral, y $\alpha$ es el nivel de significación (1% para VaR al 99%).

### VaR con el enfoque POT (GPD)

$$\text{VaR}_{\text{POT}} = U + \frac{\hat{\sigma}}{\hat{\xi}}\left[\left(\frac{N}{N_U}\alpha\right)^{-\hat{\xi}} - 1\right]$$

### VaR con el enfoque de bloques (GEV)

$$\text{VaR}_{\text{Block}} = \hat{\mu} + \frac{\hat{\sigma}}{\hat{\xi}}\left[1 - (-m\ln\alpha)^{-\hat{\xi}}\right]$$

donde $m$ es la longitud del bloque.

Aplicado a S&P500 con umbral -0.025 y ML: $\text{VaR}_{\text{MLE}} \approx -2.60\%$, consistente con el histórico pero con base estadística más sólida para cuantiles más extremos.

### Comparación empírica: mercados emergentes (Gençay y Selçuk 2004)

Estudio con datos diarios de índices de Argentina, Brasil, Hong Kong, Indonesia, Corea, México, Singapur, Taiwán y Turquía (~1993-2000). Conclusión principal: **EVT supera a todos los enfoques alternativos a medida que nos adentramos más en las colas**.

- Para cuantiles del 5% o 2.5% (VaR 95%-97.5%): la t de Student o la simulación histórica son competitivas.
- Para el cuantil del 0.1% (VaR 99.9%): EVT es el mejor método para todos los países excepto uno.
- Las colas superior e inferior tienen **formas distintas** — los modelos que asumen simetría (como la normal) están mal especificados por construcción.

Los parámetros de forma estimados oscilan entre 0.03 (Corea, colas casi normales) y 0.60 (Taiwán, colas extremadamente gruesas con varianza que no existe). Para Taiwán, $\hat{\xi} = 0.60$ implica un índice de cola de $1/\hat{\xi} \approx 1.67$, lo que significa que el segundo momento (varianza) no existe: la distribución tiene tanta masa en las colas que la varianza diverge.

---

## Tema 4: Cuestiones avanzadas

### Dependencia temporal y filtrado ARMA-GARCH

EVT asume que los datos son i.i.d., supuesto que los retornos financieros violan (GARCH, autocorrelación). La solución estándar es: ajustar un modelo ARMA-GARCH, recoger los **residuos estandarizados** (que son más cercanos a i.i.d.) y aplicar EVT sobre esos residuos. Esto combina el modelado de la dinámica temporal con la estimación precisa de los extremos.

### EVT multivariante

EVT se puede extender al caso multivariante para medir dependencia conjunta y spillovers entre series. Se usan funciones **cópula** para conectar las distribuciones marginales extremas de cada serie. Tanto el enfoque de bloques como el POT admiten esta extensión, aunque la complejidad aumenta considerablemente y no existe una definición única de "extremo multivariante".

Complicación práctica: debido a efectos de diversificación o cobertura, movimientos extremos simultáneos en activos individuales pueden no constituir un extremo para el portfolio — los movimientos se atenúan o se cancelan entre sí.

### Intervalos de confianza para el VaR de EVT

Es posible construirlos aunque no es trivial. Son útiles para evaluar si las estimaciones de VaR son suficientemente precisas o si la escasez de datos extremos hace el estimado demasiado impreciso para ser accionable.

---

## Aplicación Python: `VaR_calculation.py`

Script directo sobre datos diarios del S&P500 (`sp500_daily.xlsx`). Tres métodos en secuencia sobre los mismos datos:

**1. VaR paramétrico normal** — `norm.ppf(1-alpha, mean, std_dev)`. Resultados: VaR 90% = -1.21%, VaR 95% = -1.56%, VaR 99% = -2.21%.

**2. VaR histórico** — `data['ret'].quantile(alpha)`. Resultados: VaR 90% = -0.99%, VaR 95% = -1.44%, VaR 99% = -2.60%. El 99% histórico es mayor en valor absoluto que el normal, confirmando que los retornos tienen colas más gruesas de lo que predice la normal.

**3. Estimador de Hill** — umbral = -0.025, $\alpha = 0.01$. Filtra observaciones bajo el umbral, ordena, aplica la fórmula de Hill para $\hat{\xi}$, calcula VaR con la fórmula $\tilde{y}_{(k)} \cdot (N/N_U \cdot \alpha)^{-\hat{\xi}}$. El Hill plot muestra que el VaR converge a -3.2% aproximadamente.

**4. MLE de la GPD** — mismos umbral y $\alpha$. Construye la log-verosimilitud de la GPD como función negativa (para usar `scipy.optimize.minimize` con Nelder-Mead). Estimados: $\hat{\xi} = 0.388$, $\hat{\sigma} = 0.0075$. VaR resultante: -2.60%, consistente con el histórico pero con base distribucional explícita que permite extrapolar a cuantiles más extremos.

---

## Lo más importante para recordar

1. **EVT es el único enfoque estadísticamente válido para cuantiles muy extremos (99.9%+).** El VaR normal los subestima por un factor de hasta 16.000x. El histórico mejora pero usa un solo punto de la distribución empírica, sin aprovechar la forma de la cola.

2. **El parámetro $\xi$ lo determina todo.** Si $\xi > 0$ (Fréchet), las colas son gruesas y los momentos de orden $1/\xi$ o superior no existen. Para retornos financieros típicos, $\xi \approx 0.1$-$0.2$, lo que implica colas equivalentes a una t con 5-10 grados de libertad.

3. **La elección del umbral $U$ es el punto débil del POT.** No hay una regla objetiva universalmente aceptada. El criterio pragmático (estimar para $U$ creciente hasta que $\hat{\xi}$ se estabilice) funciona razonablemente, pero introduce subjetividad.

4. **EVT asume i.i.d.: en datos financieros, hay que filtrar primero con GARCH.** Aplicar EVT directamente sobre retornos con clusters de volatilidad da estimaciones sesgadas. El flujo correcto es ARMA-GARCH → residuos estandarizados → EVT.

5. **EVT solo gana claramente en cuantiles muy extremos.** Para VaR al 95% o 97.5%, la t de Student o el histórico son competitivos. La ventaja de EVT es decisiva para el 99.9%, que es donde el regulador (Basilea) y los gestores de riesgo de cola necesitan precisión.

6. **Las colas superior e inferior son asimétricas.** Modelarlas por separado es necesario; asumir simetría (como hace la normal) introduce sesgo sistemático en al menos una de las dos colas.

---

# Normal vs t-Student para retornos diarios: por qué importa la elección

## El hecho empírico de partida

Los retornos diarios tienen colas gruesas (*fat tails*) y skewness negativa. La normal asigna probabilidad casi cero a movimientos de más de 3σ. En la realidad ocurren con frecuencia. La t-Student los captura mejor porque tiene más masa en las colas, controlada por los grados de libertad ν.

## Consecuencias directas de elegir mal

**1. VaR paramétrico subestimado**
El cuantil 1% de una t con ν pequeño está más alejado de la media que el cuantil 1% de la normal. Si calculas VaR al 99% asumiendo normalidad, el banco subestima el capital regulatorio necesario.

**2. Expected Shortfall materialmente menor**
ES mide el promedio de pérdidas en ese 1% de cola. Con normalidad, ese promedio está artificialmente cerca del umbral. Con t-Student, la cola es más pesada y el ES es materialmente mayor — y ES es lo que exige Basilea desde 2016.

**3. Pricing de opciones y la sonrisa de volatilidad**
Black-Scholes asume lognormalidad (normal en retornos). Las colas gordas reales generan la sonrisa de volatilidad: el mercado implícitamente corrige la distribución usando volatilidades implícitas distintas por strike. La sonrisa es la huella de que la distribución real tiene más cola de lo que asume el modelo.

**4. Backtesting falla sistemáticamente**
Si el modelo es normal y los retornos son realmente t, las excepciones del VaR superan el umbral esperado. Bank of America en 2007: 14 excepciones observadas vs 2.6 esperadas al 99%.

**5. Conexión con EVT (M10)**
Cuando la EVT se aplica a colas financieras, siempre emerge la familia Fréchet — equivalente a una t-Student con pocos grados de libertad. La t-Student no es solo un ajuste empírico: es lo que la teoría predice que debe aparecer en las colas.

## So-what para el examen

Elegir t-Student no es una conveniencia estadística sino la distribución que tanto los datos empíricos como la teoría (EVT) predicen para retornos financieros en la zona que importa: las colas. Y es exactamente ahí donde cualquier modelo de riesgo tiene que ser correcto.

En el análisis gráfico y estadístico del examen: esperar Q-Q plot con desviaciones en ambos extremos (colas más pesadas que la normal), curtosis > 3, y p-valores < 0.05 en Jarque-Bera, Shapiro-Wilk y KS — todo apuntando a rechazar normalidad y favorecer t-Student.

<script type="text/markdown" id="c-p002">
# Rasgos que delatan si los datos siguen Normal o t-Student
## ν — qué es

ν (*nu*) son los **grados de libertad** de la t-Student. Es el único parámetro que controla la forma de la distribución (además de media y escala). Determina qué tan gruesas son las colas:
- ν pequeño → colas muy gruesas (más masa en los extremos)
- ν grande → colas cada vez más finas, convergiendo a la normal cuando ν → ∞

Se estima a partir de los datos (por MLE). En retornos financieros diarios suele caer entre 3 y 8.

---

## 1. Curtosis — el diagnóstico más directo

La normal tiene curtosis teórica = 3 (exceso de curtosis = 0).
La t-Student tiene curtosis = 6/(ν−4) para ν > 4, siempre positiva y creciente al bajar ν.

| ν | Curtosis exceso |
|---|---|
| ∞ (→ normal) | 0 |
| 30 | 0.21 |
| 10 | 1.0 |
| 5 | 6.0 |
| 4 | ∞ |

Curtosis empírica >> 0 → fat tails → t-Student. El valor de la curtosis orienta qué ν encaja.

## 2. Q-Q plot — firma visual de las colas

**Contra la normal:**
- Datos normales → puntos sobre la diagonal
- Datos t-Student → S abierta en ambas colas: las colas observadas están más lejos del centro de lo que la normal predice

**Contra la t-Student (con ν estimado):**
- Si ν es correcto → puntos vuelven a la diagonal
- Si aún se separan → ν mal calibrado

La S en el Q-Q normal es la firma visual de fat tails.

## 3. Skewness — asimetría

- Normal y t-Student estándar: skewness = 0 (ambas simétricas)
- Retornos reales: skewness < 0 (cola izquierda más larga)

Si la skewness es significativamente negativa, ninguna de las dos ajusta perfectamente. La t-Student sigue siendo la mejor elección porque captura fat tails, pero en rigor necesitarías una t asimétrica.

## 4. Pruebas formales y qué miden

| Test | Qué mide | Limitación |
|---|---|---|
| **Jarque-Bera** | Desviación conjunta de skewness=0 y curtosis=3 | En muestras grandes casi siempre rechaza aunque la desviación sea trivial |
| **Shapiro-Wilk** | Correlación entre datos y cuantiles normales | Más potente en muestras pequeñas (<5000) |
| **Kolmogorov-Smirnov** | Distancia máxima entre CDF empírica y CDF teórica | Más sensible al centro que a las colas — el peor para detectar fat tails |

Para elegir entre normal y t-Student, JB es el más informativo: si el p-valor bajo viene de curtosis alta (no de skewness), señala directamente fat tails → t-Student.

## 5. Estimación de ν por MLE como diagnóstico cuantitativo

- ν > 30 → prácticamente indistinguible de una normal
- ν ∈ [5, 10] → colas moderadas, típico en retornos diarios de índices
- ν < 5 → colas muy gruesas, típico en activos individuales o crisis
- ν ≤ 4 → varianza infinita teórica

## Jerarquía para el examen

1. Curtosis empírica >> 3 → fat tails → candidato t-Student
2. Q-Q plot con S abierta contra normal → confirma fat tails
3. JB rechaza por curtosis, no por skewness → apunta a t-Student
4. MLE de ν ∈ [3, 10] → t-Student ajusta bien con ese ν
5. Q-Q plot contra t-Student con ν estimado → si puntos vuelven a la diagonal, elección confirmada
</script>

# Cómo se calcula el VaR

El VaR es siempre un **cuantil de la distribución de pérdidas** al nivel de confianza elegido. Lo que cambia entre métodos es cómo construyes esa distribución.



## Cómo leer el resultado: `quantile(0.01)` → -5.75%

`quantile(0.01)` mira solo la **cola izquierda** — el 1% peor de los retornos históricos. No miras la cola derecha porque el riesgo es la pérdida, no la ganancia.

Lo que dice ese -5.75%: el 1% de los días históricos tuvo retornos ≤ -5.75%. El 99% de los días tuvo retornos > -5.75%. El VaR es ese punto de corte.

## Nomenclatura: ¿VaR al 99% o al 1%?

Es una ambigüedad que confunde habitualmente. Son dos formas de nombrar el mismo número:

- **Por nivel de confianza**: VaR al 99% → en el 99% de los casos no superas esa pérdida
- **Por nivel de significancia** (la cola): VaR al 1% → estás mirando el percentil 1

`quantile(0.01)` = VaR al **99% de confianza** = VaR al **1% de significancia**. Cuando veas `VaR_95` en código, verifica cuál de los dos están usando — lo normal es que se refiera al nivel de confianza (95%), que corresponde a `quantile(0.05)`.

## Método 1 — Simulación histórica

Sin asumir distribución. Se usan retornos reales pasados, se ordenan, y el VaR es el percentil correspondiente:

```python
VaR_99 = s.quantile(0.01)
```

Captura fat tails y asimetría automáticamente porque los datos históricos ya los contienen. Limitación: asume que el futuro se parece al pasado; y el percentil 1 puede estar mal estimado si la ventana histórica es corta o no ha vivido escenarios extremos.

## Método 2 — Varianza-covarianza (paramétrico)

Asumes que los retornos son normales y calculas el VaR analíticamente:

$$\text{VaR} = V \cdot \sigma_p \cdot Z_\alpha$$

- $V$: valor del portfolio
- $\sigma_p$: desviación típica del portfolio
- $Z_\alpha$: cuantil de la normal estándar (95% → 1.645; 99% → 2.326)

```python
VaR = norm.ppf(0.01, mean, std)
```
**Ventajas frente al histórico:**

1. **No necesitas historial largo.** El histórico depende de que hayas vivido escenarios extremos en tu ventana de datos. Con varianza-covarianza solo necesitas media y std.

2. **Es analítico y estable.** El percentil 1 histórico puede saltar mucho si entra o sale un día de crash de tu ventana. La normal es más suave y estable en el tiempo.

3. **Escala fácil a portfolios** — esta es la razón más importante. Para un portfolio de N activos, el histórico necesita que todos los activos hayan coexistido en el mismo periodo. El varianza-covarianza solo necesita la matriz de covarianzas, y el VaR del portfolio se calcula analíticamente:

```python
var_portfolio = z * np.sqrt(w.T @ cov_matrix @ w)
```

**Problema**: subestima el riesgo con fat tails — asume normalidad cuando los retornos reales no la cumplen.

## Método 3 — Monte Carlo

Simulas miles de retornos futuros posibles desde la distribución que tú elijas, y coges el percentil 1 de esas simulaciones.

```python
simulations = stats.t.rvs(df=nu, loc=mean, scale=std, size=100_000)
VaR_99 = np.percentile(simulations, 1)
```
Con simulación de distribución normal:
Con simulación de t-student:

**Ventajas:**
- Flexible: puedes simular cualquier distribución (t-Student, GARCH, saltos...)
- Escala bien a portfolios con correlaciones complejas
- No depende de haber vivido los escenarios extremos en el historial

**Desventajas:**
- Su calidad depende totalmente de lo bien que modeles la distribución de partida — *garbage in, garbage out*
- Si simulas una normal, es varianza-covarianza con pasos extra
- Computacionalmente caro
- Difícil de explicar y auditar en entornos regulatorios

## Método 4 — EVT (Teoría del Valor Extremo)

Los tres métodos anteriores modelan toda la distribución de retornos. EVT hace algo distinto: **modela solo la cola**, donde ocurren las pérdidas graves, sin asumir nada sobre el centro de la distribución.

El resultado teórico clave: bajo ciertas condiciones, los valores extremos de *cualquier* distribución convergen a una de solo tres familias posibles. En finanzas siempre aparece la misma — colas gruesas (Fréchet) — equivalente a una t-Student con pocos grados de libertad.

Hay dos implementaciones prácticas:

**POT (Peaks Over Threshold):** se elige un umbral $U$ y se modelan solo las observaciones que lo superan. Las excedencias siguen una **GPD** (Generalised Pareto Distribution). El VaR se calcula como:

$$\text{VaR}_{\text{POT}} = U + \frac{\hat{\sigma}}{\hat{\xi}}\left[\left(\frac{N}{N_U}\alpha\right)^{-\hat{\xi}} - 1\right]$$

**Hill (estimador no paramétrico):** alternativa más simple, aplicable solo a colas gruesas. Ordena las excedencias y estima el parámetro de forma $\xi$ promediando los logaritmos de los ratios entre valores extremos consecutivos:

$$\text{VaR}_{\text{Hill}} = \tilde{y}_{(k)} \cdot \left(\frac{N}{N_U}\alpha\right)^{-\hat{\xi}}$$

En ambos casos, $\hat{\xi}$ es el parámetro que controla el grosor de la cola. En retornos financieros típicos, $\hat{\xi} \approx 0.1$–$0.4$.

**Ventajas:**
- Estadísticamente válido para cuantiles muy extremos (99.9%+) donde los demás métodos fallan
- No asume ninguna distribución para el centro de los datos
- La evidencia empírica muestra que supera a todos los otros métodos a medida que te adentras más en la cola

**Desventajas:**
- Asume datos i.i.d. — en retornos financieros hay que filtrar primero con GARCH, extraer los residuos estandarizados, y aplicar EVT sobre esos residuos
- La elección del umbral $U$ en POT es subjetiva y crítica: demasiado bajo introduce sesgo, demasiado alto deja pocas observaciones
- Para VaR al 95%–97.5%, la t-Student o el histórico son igual de buenos — EVT solo gana claramente en cuantiles muy extremos

## Escalado temporal

$$\text{VaR}_{n\text{ días}} = \text{VaR}_{1\text{ día}} \times \sqrt{n}$$

Asume retornos i.i.d. — supuesto que falla en periodos de estrés.

## Conexión con el análisis de distribución (→ respuesta_001, respuesta_002)

El análisis Normal vs t-Student no es un ejercicio previo independiente: es el prerequisito del VaR. Si se asume normalidad con datos que tienen fat tails, el VaR paramétrico subestima la pérdida real. La elección de t-Student justifica usar Monte Carlo con la distribución calibrada, que es el método más honesto dado lo que muestran los datos de Apple.

# Intuición detrás de escalar el VaR con √n

## Por qué no es simplemente ×n

Si el riesgo fuera el mismo cada día y los días fueran independientes, perder 1% diario durante 10 días daría -10%. Pero el VaR no es una pérdida fija — es una medida de dispersión. Y la dispersión de una suma de variables aleatorias no crece linealmente, crece con la raíz cuadrada del número de términos.

## La intuición estadística

Si cada retorno diario tiene desviación típica σ, y los días son independientes entre sí, la desviación típica acumulada en n días es:

$$\sigma_n = \sigma \times \sqrt{n}$$

Esto viene de que la **varianza sí es aditiva**: Var_n = n · σ², y al sacar la raíz cuadrada aparece √n.

El VaR paramétrico es Z_α × σ, así que escala igual que σ: multiplicando por √n.

## La analogía física

Es la misma lógica que el movimiento browniano: una partícula que da pasos aleatorios no se aleja linealmente en el tiempo — se aleja proporcionalmente a √t. Si hoy puede ir 1 metro, en 100 pasos esperamos que esté a 10 metros del origen, no a 100. Los pasos en direcciones opuestas se cancelan parcialmente.

## Por qué es un supuesto fuerte

La regla √n asume retornos **i.i.d.** — independientes entre sí y con la misma distribución cada día. Eso falla en la práctica:
- Si hay un crash hoy, mañana la volatilidad es mayor (GARCH — los días no son independientes)
- En periodos de estrés, los retornos extremos se encadenan

Por eso Basilea exige el VaR a 10 días pero permite calcularlo como VaR diario × √10 solo como **aproximación regulatoria** — no como verdad estadística.
