# Mapa de los Módulos 7-10: Finanzas Cuantitativas

---

## La pregunta que responden los cuatro módulos

> *¿Cuánto vale algo que depende del futuro, y cuánto puedo perder si me equivoco?*

Hay una tensión que recorre los cuatro módulos y que nunca se dice explícitamente:

> **Los modelos asumen normalidad. Los mercados no son normales. Todo lo demás es gestionar esa contradicción.**

- M7 construye los modelos asumiendo normalidad (o lognormalidad)
- M8 muestra que el mercado *sabe* que eso falla y lo corrige con la sonrisa de volatilidad
- M9 mide el riesgo con esos modelos imperfectos
- M10 dice "olvidemos la normalidad en las colas y modelémoslas directamente"

Es la misma historia contada cuatro veces, cada vez con más honestidad sobre lo que los modelos no pueden hacer.

---

## Módulo 7 — ¿Cómo valoro activos financieros?

**La clave que conecta todo:** el valor presente. Todo activo financiero vale lo que te va a dar en el futuro, descontado al hoy. La diferencia entre bono, acción y opción es solo cuán incierto es ese flujo futuro y quién asume esa incertidumbre.

**Bloque 1 — Conceptos base**

Antes de valorar nada, hay que medir. El módulo construye el lenguaje: retornos, riesgo, distribuciones y diversificación (Markowitz). Los retornos no son normales en la realidad — tienen colas gordas y skewness negativa — pero los modelos que vienen después asumen normalidad de todas formas. Esa tensión recorre todo lo que sigue.

**Bloque 2 — Valoración de bonos y acciones**

Todo activo vale el descuento de sus flujos futuros. La diferencia es cuán predecibles son esos flujos: un bono tiene cupones fijos (fácil), una acción tiene dividendos inciertos (más difícil). Los **factores de riesgo** (CAPM, APT, Fama-French) no son una tercera categoría de valoración: son la respuesta a *"¿qué tasa de descuento uso?"*. Son la fontanería del denominador.

**Bloque 3 — Valoración de opciones y derivados**

Una opción es el instrumento donde la incertidumbre es más extrema: el comprador tiene el derecho pero no la obligación, así que el valor depende de toda la distribución futura del precio. Black-Scholes convierte esa distribución futura en un precio presente. El único input no observable es la volatilidad — pequeñas diferencias en ella generan grandes diferencias de precio.

---

## Módulo 8 — ¿Cómo gestiono el riesgo de tener opciones en cartera?

El módulo tiene tres temas que comparten un eje: la distancia entre los modelos teóricos y cómo operan los mercados de verdad.

**Dynamic Hedging — gestionar el riesgo de haber vendido una opción**

Cuando vendes una opción, asumes la obligación contraria a quien la compra. Si vendiste una call de Repsol a 15€ y el precio sube a 25€, tienes que venderla a 15€ aunque en el mercado cueste 25€. Para cubrirte, compras acciones de Repsol directamente: si el precio sube, ganas en las acciones lo que pierdes en la opción.

El problema es que no sabes si van a ejercer la opción o no, así que no compras todas las acciones — compras una fracción. Esa fracción es la **delta**. Si la probabilidad de que ejerzan es del 60%, compras 0.6 acciones por cada opción vendida. Esa fracción cambia cada día según cómo evoluciona el precio, por eso hay que reajustar continuamente. El coste de esos reajustes es el coste real de la cobertura. Las demás griegas (gamma, vega, theta) miden otras dimensiones del mismo riesgo: cuánto cambia la delta, cuánto afecta la volatilidad, cuánto afecta el paso del tiempo.

**La sonrisa de volatilidad — Black-Scholes falla, y el mercado lo sabe**

Black-Scholes asume volatilidad constante. No es verdad. Los traders lo saben y han desarrollado un *hack*: usan Black-Scholes igualmente, pero en vez de meterle una volatilidad fija le meten una volatilidad diferente para cada opción según su precio de ejercicio y su vencimiento. La "sonrisa" es el mapa de qué volatilidad usar en cada caso. Black-Scholes pasa de ser un modelo a ser una **calculadora con parámetros ajustables**.

En acciones e índices la curva no es simétrica sino sesgada: las puts baratas (protección contra crash) tienen volatilidad implícita muy alta. Este sesgo no existía antes de 1987 — el mercado aprendió que los desplomes extremos son más probables de lo que implica el modelo y desde entonces incorpora esa prima.

**Gestión activa de carteras — tres filosofías para desviarte del índice**

Un gestor pasivo replica un índice. Un gestor activo toma posiciones que se desvían apostando a que sus señales generan rentabilidad adicional (alpha). Hay tres respuestas distintas a cómo hacerlo:

- **Treynor-Black**: tienes ideas sobre acciones concretas infravaloradas → construyes el portfolio desde abajo, ponderando cada apuesta por su ratio alpha/riesgo
- **Black-Litterman**: tienes ideas sobre sectores o mercados → partes de los pesos del índice (equilibrio CAPM) y los ajustas con tus creencias usando Bayes. Más estable que la optimización clásica porque ancla en el mercado
- **Risk Parity**: en vez de igualar dinero invertido, igualas riesgo aportado por cada activo. Sobrepondera activos de bajo riesgo (bonos) e infrapondera los de alto riesgo (acciones); en la práctica suele apalancar la parte de bonos para alcanzar la rentabilidad de un portfolio tradicional

Son tres filosofías distintas, no tres pasos de un proceso.

---

## Módulo 9 — ¿Cuánto puedo perder?

El módulo responde: *¿de cuántas formas distintas puedo perder dinero?* La respuesta tiene tres capítulos.

**Riesgo de mercado — el precio se mueve en tu contra**

Aquí vive el **VaR** (Value at Risk): un número que dice *"con 99% de probabilidad, mañana no pierdo más de X"*. Se puede calcular de tres formas:

- Asumiendo normalidad (rápido, pero miente en las colas)
- Con simulación histórica (usas datos reales, sin asumir distribución)
- Con Monte Carlo (simulas miles de escenarios)

El VaR tiene un problema estructural: no dice nada de lo que pasa en ese 1% malo, solo que existe. El **Expected Shortfall** sí: *"dado que estoy en ese 1% peor, ¿cuánto pierdo de media?"*. ES es el VaR mejorado y es lo que exige Basilea desde 2016. Aquí conecta directamente el Módulo 10: si el VaR paramétrico falla porque asume normalidad, EVT proporciona la herramienta para calcular ese extremo con más precisión.

**Riesgo de crédito — la contraparte no paga**

Dos problemas distintos bajo el mismo paraguas. Primero: ¿cuánto vale un bono que puede impagar? Los modelos estructurales (Merton) tratan el equity de una empresa como una call sobre sus activos — si el valor de los activos cae por debajo de la deuda, la empresa quiebra. Segundo: ¿cómo gestiono una cartera de créditos donde los defaults están correlacionados? Si quiebra una empresa, ¿quién más quiebra con ella? Aquí entran las cópulas, la misma herramienta que EVT usa para el caso multivariante.

**Riesgo de liquidez — el activo vale X en teoría pero no puedes venderlo a ese precio**

Dos dimensiones que se confunden pero son distintas. La **liquidez de mercado** es el coste de salir de una posición: el bid-ask spread. La **liquidez de financiación** es no tener cash para mantener una posición aunque tengas razón. Esta segunda mató a LTCM en 1998: tenían razón en sus apuestas pero no pudieron aguantar hasta que el mercado les diera la razón. Un activo puede ser ilíquido en mercado pero tener financiación, o viceversa; en una crisis, ambas se deterioran a la vez y se retroalimentan.

---

## Módulo 10 — ¿Qué pasa en ese 1% que el VaR ignora?

EVT no es un modelo alternativo al VaR. Es una mejora específica para el extremo de la cola. Para el 95% del tiempo, el VaR normal funciona bien. EVT solo importa cuando la pregunta es *"¿qué pasa en un crash de verdad?"* — y esa es exactamente la pregunta que los reguladores hacen después de cada crisis.

La estadística clásica modela el comportamiento promedio. EVT modela solo las colas, donde ocurren las pérdidas graves. El resultado teórico clave: bajo ciertas condiciones, los valores extremos de *cualquier* distribución convergen a una de solo tres distribuciones posibles. En finanzas siempre aparece la misma: colas gruesas (Fréchet), que es equivalente a una t de Student con pocos grados de libertad.

Hay dos formas de aplicarlo. El enfoque de **bloques** toma el máximo de cada periodo y modela esa serie de máximos. El enfoque **POT** (Peaks Over Threshold) modela directamente las observaciones que superan un umbral — es el preferido en la práctica porque aprovecha más datos. El punto débil de POT es elegir ese umbral: demasiado bajo introduce sesgo, demasiado alto deja muy pocas observaciones.

Una advertencia práctica importante: EVT asume que los datos son independientes entre sí. Los retornos financieros no lo son (hay clusters de volatilidad, autocorrelación). El flujo correcto es filtrar primero con un modelo GARCH, extraer los residuos estandarizados, y aplicar EVT sobre esos residuos.

---

## El hilo que une los cuatro

| Módulo | Pregunta | Herramienta clave |
|---|---|---|
| M7 | ¿Cuánto vale este activo? | Descuento de flujos, Black-Scholes |
| M8 | ¿Cómo gestiono el riesgo de tenerlo? | Delta hedging, superficie de volatilidad |
| M9 | ¿Cuánto puedo perder en total? | VaR, Expected Shortfall |
| M10 | ¿Qué pasa cuando los modelos de M9 se rompen? | EVT, GPD, GEV |

# Módulo 7 — Valoración de Instrumentos Financieros

El módulo responde tres preguntas en secuencia: cómo medir retorno y riesgo (T6-10), cómo usar esas medidas para valorar bonos y acciones (T11-17), y cómo extender esa valoración a instrumentos derivados (T18-21).

---

## Bloque 1 — Medición: Retorno, Riesgo y Diversificación (T6-10)

### T6: Retornos

El denominador común para comparar inversiones es el retorno. Los **log-retornos** son el estándar cuantitativo porque se suman en el tiempo:

$$r_t = \ln(P_t / P_{t-1})$$

El valor temporal del dinero es la base de toda la valoración: $PV = C/(1+r)^T$. En el límite (capitalización continua): $FV = Pe^{rT}$, que aparece directamente en Black-Scholes. La **relación de Fisher** separa tipo nominal de tipo real: $r_{nominal} \approx r_{real} + \pi^e$.

### T7: Estadísticos de riesgo

Los cuatro momentos que importan para describir retornos:

| Estadístico | Normal |
|---|---|
| Media $\mu$ | cualquier valor |
| Varianza $\sigma^2$ | cualquier valor |
| Skewness $\gamma$ | 0 |
| Kurtosis $\kappa$ | 3 |

Escalado a datos anuales (250 días): $\sigma_{anual} = \sqrt{250}\,\sigma_{diaria}$. La **utilidad esperada** de un inversor averso al riesgo: $U = E(r) - \frac{\lambda}{2}\sigma^2$.

### T8: Distribuciones no normales

Los retornos reales tienen skewness negativa y kurtosis > 3. Alternativas:

- **t de Student:** colas gruesas con varianza finita. $\kappa = 6/(\nu-4)$.
- **Estable Paretiana:** varianza infinita para $\alpha < 2$; invalida el análisis media-varianza.
- **Mezcla de normales:** regímenes de calma/pánico producen colas gordas aunque cada régimen sea normal.
- **Jump-diffusion:** browniano + saltos de Poisson; explica el volatility smile de opciones.
- **Lognormal:** si log-retornos son normales, precios son lognormales. Base de Black-Scholes.

### T9: Diversificación de Markowitz

Dos tipos de riesgo en cartera: **idiosincrático** (diversificable) y **sistemático** (no diversificable). Con $n$ activos iguales y correlación $\rho$:

$$\sigma_P^2 = \frac{\sigma^2}{n} + \frac{n-1}{n}\rho\sigma^2 \xrightarrow{n\to\infty} \rho\sigma^2$$

La varianza de cartera en forma matricial: $\sigma_P^2 = \mathbf{w}^T\boldsymbol{\Sigma}\mathbf{w}$. La **frontera eficiente** es el conjunto de portfolios que maximizan retorno para cada nivel de riesgo. El **Sharpe ratio** mide retorno en exceso por unidad de riesgo:

$$S_P = \frac{E(r_P) - r_f}{\sigma_P}$$

El portfolio completo óptimo asigna fracción $y^* = (E(r_P) - r_f)/(\lambda\sigma_P^2)$ a activos de riesgo.

### T10: Más allá de media-varianza

Tres criterios alternativos cuando la distribución no es normal:

1. **Media Geométrica (GMR):** $r_g \approx \bar{r} - \frac{1}{2}\sigma^2$. Captura el efecto del compounding; penaliza la volatilidad automáticamente.
2. **Safety-First:** fijan retorno mínimo $r_L$ y/o probabilidad máxima de caer bajo él. Roy ($r_L = r_f$) produce el mismo portfolio que Sharpe ratio.
3. **Dominancia Estocástica (FSD/SSD/TSD):** compara CDFs completas sin asumir distribución; conceptualmente más general pero computacionalmente prohibitivo con muchos activos.

---

## Bloque 2 — Valoración I: Bonos, Acciones y Factores de Riesgo (T11-17)

### T11: Renta fija (Fixed Income)

**Precio de un bono** (cupón anual, yield constante $r$, vencimiento $T$):

$$P = \frac{\text{par}}{(1+r)^T} + \frac{\text{cupón}}{r}\left[1 - \frac{1}{(1+r)^T}\right]$$

- **YTM:** tasa $r$ que iguala precio de mercado con precio teórico.
- **Dirty price** = precio limpio + accrued interest.
- **Duration modificada $D^*$:** sensibilidad del precio al yield. Con corrección de convexidad:

$$\frac{\Delta P}{P} \approx -D^*\Delta y + \frac{\text{convexity}}{2}(\Delta y)^2$$

- Bonos callable tienen convexidad negativa (el emisor ejerce la call cuando tipos bajan → el precio tiene techo).
- **Credit spread** = yield corporativo − yield soberana. TED spread > 50 bp → señal de estrés.

Características relevantes: floating rate, indexed bonds, convertibles (a favor del inversor); callable, sinking fund, asset-backed (a favor del emisor).

### T12: Curvas de tipos

La **yield curve** (spot rates vs. plazos) resume las expectativas de mercado sobre tipos futuros. Factores clave: nivel, pendiente, curvatura (Litterman-Scheinkman). Construcción: **bootstrapping** iterativo de menor a mayor plazo.

Formas y señales: curva normal (crecimiento), invertida (recesión esperada), joroba (defensa de divisa). Cuatro teorías: expectations hypothesis, liquidity preference, segmentación de mercado, preferred habitat.

Modelos: **Vasicek** (proceso Ornstein-Uhlenbeck para la tasa corta), **Nelson-Siegel/Svensson** (factores de nivel, pendiente y curvatura).

### T13: Valoración de acciones (Equity Valuation)

**Modelos por descuento:**

- **DDM Gordon-Shapiro:** $V_0 = D_1/(k-g)$, donde $g = b \times \text{ROE}$ (fracción retenida × ROE).
- **FCFF:** $V_0^{firma} = \sum_t \text{FCFF}_t/(1+\text{WACC})^t$, con $\text{WACC} = w_e r_e + w_d r_d(1-\tau)$.
- **PVGO:** $P_0 = E_1/k + \text{PVGO}$. Si PVGO < 0, la empresa destruye valor reinvirtiendo.

**Múltiplos:** P/E, P/B, P/CF, P/S. Limitación: earnings gestionables, inútiles en pérdidas.

**Corrección de Jensen:** cuando $\hat{k}$ y $\hat{g}$ tienen incertidumbre, el precio justo incluye un término de segundo orden que depende de sus varianzas y covarianza.

### T14: CAPM

Bajo los supuestos estándar (muchos inversores price-takers, horizonte único, expectativas homogéneas, sin impuestos ni fricción), todos sostienen el portfolio de mercado M. La ecuación del CAPM:

$$E(r_i) - r_f = \beta_i[E(r_M) - r_f] \quad;\quad \beta_i = \frac{\text{Cov}(r_i, r_M)}{\sigma_M^2}$$

El **Single-Index Model** reduce inputs de $\frac{n(n+3)}{2}$ a $3n+3$ (para $n=50$: 1.325 → 153). La **SML** identifica activos infra/sobrevalorados según su alpha.

Limitaciones: un solo factor, beta histórico predice mal el futuro, portfolio de mercado teórico inobservable. Mejoras: betas ajustados (Blume/Vasicek), CAPM condicional (betas varían con el ciclo), ICAPM de Merton.

### T15: APT y modelos multifactor

**APT (Ross 1976):** sin arbitraje implica que el retorno esperado se explica solo por exposiciones a factores:

$$R_i \approx \beta_{i,1}F_1 + \ldots + \beta_{i,k}F_k$$

**Factores macro (Chen-Roll-Ross):** producción industrial, inflación esperada, sorpresa de inflación, credit spread corporativo, pendiente de la curva.

**Factores de estilo:** Fama-French 3F (mercado + SMB + HML), Carhart 4F (+momentum WML), Fama-French 5F (+RMW + CMA). Harvey-Liu-Zhu: solo son estadísticamente robustos mercado, HML, momentum, liquidez y volatilidad a corto plazo.

**Factores de liquidez:** Acharya-Pedersen (bid-ask spread como factor), Pastor-Stambaugh (volumen en dólares como proxy).

*(Temas 16 y 17 no disponibles en el PDF del curso.)*

---

## Bloque 3 — Valoración II: Derivados y Pricing de Opciones (T18-21)

### T18: Contratos derivados

Cuatro tipos fundamentales:

| Tipo | Obligación | Mercado | Uso principal |
|---|---|---|---|
| Forward | Ambas partes | OTC (bilateral) | Cobertura de FX/materias primas |
| Futuro | Ambas partes | Bolsa (estandarizado) | Cobertura con menor riesgo de contraparte |
| Opción | Solo el vendedor | Ambos | Cobertura + especulación; prima por la asimetría |
| Swap | Flujos recurrentes | OTC | Gestión de riesgo de tipos/divisas |

La diferencia estructural clave: forward/futuro obligan a ambas partes; la opción da flexibilidad unilateral al comprador a cambio de una prima.

### T19: Fórmula de Black-Scholes

Precio analítico de una call europea bajo lognormalidad, volatilidad y tasa constantes, sin dividendos:

$$C = S \cdot N(d_1) - K \cdot e^{-rT} \cdot N(d_2)$$

$$d_1 = \frac{\ln(S/K) + (r + \sigma^2/2)\,T}{\sigma\sqrt{T}}, \qquad d_2 = d_1 - \sigma\sqrt{T}$$

$N(d_2)$ = probabilidad de terminar in the money. $N(d_1)$ pondera además el tamaño del beneficio. En Python: `scipy.stats.norm.cdf()`.

Paridad put-call: $C - P = S - K e^{-rT}$ (permite valorar puts desde calls sin nueva derivación).

### T20-21: Monte Carlo y discretización de Euler

**Monte Carlo directo (T20):** simula el precio final del subyacente bajo GBM:

$$S_T = S_0 \cdot e^{(r - \sigma^2/2)T + \sigma\sqrt{T}\,Z}, \quad Z \sim N(0,1)$$

El precio de la call = $e^{-rT} \cdot \mathbb{E}[\max(S_T - K, 0)]$. Converge a Black-Scholes con suficientes iteraciones.

**Discretización de Euler (T21):** simula la trayectoria completa en pasos $\Delta t$:

$$S_t = S_{t-1} \cdot e^{(r - \sigma^2/2)\Delta t + \sigma\sqrt{\Delta t}\,Z_t}$$

Ventaja sobre la fórmula cerrada: funciona para opciones path-dependent (barrera, asiáticas, americanas) y cualquier proceso estocástico (varianza estocástica, saltos). Black-Scholes es exacto para opciones europeas simples; Euler es la herramienta general.

---

## Lo más importante para recordar

1. **Log-retornos son el lenguaje de trabajo.** Se suman en el tiempo, conectan con capitalización continua y son el input de todos los modelos del módulo.

2. **Los retornos no son normales.** Colas gordas y skewness negativa son universales. Las mezclas de normales y jump-diffusion son las explicaciones más convincentes. El modelo correcto depende del cuantil que importa.

3. **La diversificación elimina riesgo específico sin coste.** El riesgo sistemático persiste. El CAPM mide exactamente ese riesgo que no desaparece diversificando.

4. **CAPM es el punto de partida, no el final.** Un solo factor es insuficiente empíricamente. APT y modelos de estilo (Fama-French, Carhart) mejoran el ajuste; el coste es la interpretabilidad y el sobreajuste.

5. **Black-Scholes convierte distribución futura en precio presente.** La volatilidad $\sigma$ es el único input no observable: pequeñas diferencias en $\sigma$ generan grandes diferencias de precio. La volatilidad implícita del mercado es la métrica que realmente importa.

6. **Euler generaliza Black-Scholes a cualquier proceso.** Para opciones europeas, la fórmula cerrada es exacta y más eficiente. Euler es necesario cuando el payoff depende de la trayectoria o cuando el proceso es no-lognormal.

# Módulo 7 — Temas 6, 7, 8, 9 y 10: Retornos, Riesgo y Diversificación

---

## Para qué sirve este bloque

Antes de poner precio a cualquier instrumento financiero — un bono, una acción, una opción — necesitas responder dos preguntas previas:

1. **¿Cuánto puedo esperar ganar?** (retorno)
2. **¿Cuánto puedo perder, y con qué probabilidad?** (riesgo)

Sin esas dos piezas, la valoración no tiene base. El CAPM, Black-Scholes, la curva de tipos: todos usan retorno esperado y volatilidad como inputs. Este bloque es el lenguaje que hace posible todo lo que viene después.

---

## Tema 6: Retornos — el lenguaje común del dinero

### La idea central

Para comparar inversiones distintas (un bono a 2 años, acciones, un inmueble) necesitas un denominador común. La respuesta es el **retorno**: cuánto ganas por cada euro invertido, expresado de forma que sea comparable.

### Valor temporal del dinero

El concepto más importante de las finanzas: **100€ hoy valen más que 100€ dentro de un año**, aunque la inflación fuera cero. ¿Por qué? Porque puedes invertirlos hoy y tener más mañana. Por tanto, para comparar cantidades en distintos momentos del tiempo necesitas descontarlas o capitalizarlas usando una tasa.

- **Valor presente (PV):** cuánto vale hoy un pago futuro → $PV = \frac{C}{(1+r)^T}$
- **Valor futuro (FV):** a cuánto crece tu dinero → $FV = PV \cdot (1+r)^T$

Todo el análisis de descuento de flujos de caja (DCF), que se usa para valorar acciones y bonos, descansa sobre esto.

### Compounding (interés compuesto)

La frecuencia con la que se capitaliza el interés cambia el resultado real:

$$FV = P\left(1 + \frac{r}{N}\right)^{NT}$$

En el límite (capitalización continua): $FV = Pe^{rT}$

Esta fórmula de capitalización continua aparece constantemente en los modelos de derivados (Black-Scholes usa $e^{rT}$ para descontar).

### Log-retornos

En la práctica, en vez de calcular la rentabilidad como:

$$R = \frac{P_t - P_{t-1}}{P_{t-1}}$$

se usan **log-retornos**:

$$r_t = \ln\left(\frac{P_t}{P_{t-1}}\right) = \ln(P_t) - \ln(P_{t-1})$$

La ventaja es que los log-retornos **se suman en el tiempo**, lo que simplifica los modelos. Si ganas un 5% en enero y un 3% en febrero, el retorno acumulado es simplemente $r_{enero} + r_{febrero}$. Con retornos simples eso no funciona. Los log-retornos son el estándar en finanzas cuantitativas.

### Tipos nominales vs. reales

- **Tipo nominal:** lo que promete el instrumento en euros corrientes.
- **Tipo real:** lo que ganas en poder adquisitivo real, corrigiendo por inflación.

Relación de Fisher (1930): $r_{nominal} \approx r_{real} + \text{inflación esperada}$

Importante para valorar bonos indexados a la inflación (TIPS) y para cualquier análisis de largo plazo.

---




## Tema 7: Riesgo vs. Retorno — los estadísticos que importan

### La idea central

Si los mercados incorporan información rápidamente, los precios se mueven de forma impredecible. El modelo matemático natural para eso es el **movimiento browniano geométrico**:

$$\frac{dS_t}{S_t} = \mu \, dt + \sigma \, dW_t$$

donde $\mu$ es la tendencia media y $\sigma$ es la volatilidad. Si este modelo fuera exactamente correcto, los log-retornos serían **normalmente distribuidos**. El problema es que no lo son — y eso es el tema 8.

### Estadísticos clave para caracterizar retornos

Para caracterizar la distribución de retornos, los cuatro momentos que importan:

| Estadístico | Qué mide | Normal |
|---|---|---|
| **Media** ($\mu$) | Retorno esperado | cualquier valor |
| **Varianza** ($\sigma^2$) | Dispersión cuadrática | cualquier valor |
| **Skewness** ($\gamma$) | Asimetría — ¿más sorpresas malas o buenas? | 0 |
| **Kurtosis** ($\kappa$) | Peso de las colas — ¿qué tan extremos son los extremos? | 3 |

Para escalar a datos anuales (con 250 días de trading):
- $\sigma_{anual} = \sqrt{250} \cdot \sigma_{diaria}$
- Skewness y kurtosis no escalan — son invariantes al período de medición.

### Riesgo y prima de riesgo

El mercado compensa por asumir riesgo. El exceso de retorno respecto al activo libre de riesgo se llama **prima de riesgo**:

$$\text{Prima de riesgo} = E(r_i) - r_f$$

Para acciones estadounidenses, históricamente ~6–8% anual sobre el bono del Tesoro. No es constante: varía entre 3–15% dependiendo del período y el entorno macro.

La **utilidad esperada** de un inversor averso al riesgo bajo normalidad:

$$U = E(r) - \frac{\lambda}{2}\sigma^2$$

donde $\lambda$ es el coeficiente de aversión al riesgo ($\lambda \in [2, 4]$ en la práctica). A mayor $\lambda$, más penaliza la varianza.

---




## Tema 8: Distribuciones No Normales — cuando los modelos estándar fallan

### La idea central

Los retornos reales tienen **colas más gordas que la normal** (kurtosis > 3) y **asimetría negativa**. Datos de 14 mercados desarrollados lo confirman: índices de acciones muestran kurtosis 5-7; activos como gas natural o trigo alcanzan 31-60. Un modelo que asume normalidad asigna probabilidad casi cero a caídas del 5-sigma — que en mercados reales ocurren una vez por década.

### Distribuciones alternativas

**Estable Paretiana** — parámetro clave $\alpha \in (0,2)$: para $\alpha < 2$ la varianza es **infinita** y el análisis media-varianza de Markowitz pierde su base. Fama (1965) estimó $\alpha \approx 1.7$ para acciones diarias.

**t de Student** — captura leptocurtosis con varianza finita. Kurtosis $= 6/(\nu-4)$; converge a la normal para $\nu \to \infty$. Alternativa práctica a la estable Paretiana.

**Mezcla de normales** — el mercado alterna entre regímenes (calma/pánico); cada régimen es normal pero la mezcla produce colas gordas. Versión discreta (Kon 1984) y secuencial con rupturas estructurales (Kim y Kon 1996).

**Jump-diffusion** — movimiento browniano + saltos de Poisson para modelar shocks de noticias inesperadas. Base de extensiones de Black-Scholes que explican el "volatility smile".

**Lognormal** — si los log-retornos son normales, los retornos simples son lognormales: $E(1+r_t) = e^{\dot{\mu} + \frac{1}{2}\dot{\sigma}^2}$. Incorpora la asimetría por responsabilidad limitada. El CAPM sigue siendo válido bajo lognormalidad.

### Resumen comparativo

| Distribución | Varianza finita | Captura skewness | Captura fat tails | Uso en práctica |
|---|---|---|---|---|
| Normal | Sí | No | No | Base teórica |
| Estable Paretiana | No (si $\alpha<2$) | Sí | Sí | Investigación académica |
| t de Student | Sí | No | Sí | Riesgo de mercado, opciones |
| Mezcla de normales | Sí | Sí | Sí | Modelos de régimen |
| Jump-diffusion | Sí | Sí | Sí | Opciones avanzadas |
| Lognormal | Sí | Sí (positiva) | Moderado | Precios de acciones, B-S |

---

## Tema 9: Diversificación — cómo construir carteras

### La idea central

Mezclar activos que no se mueven igual reduce el riesgo sin reducir el retorno esperado. Esta es la única forma conocida de reducir riesgo sin coste.

### Dos tipos de riesgo

**Riesgo idiosincrático (específico)** — propio de un activo concreto. Si inviertes solo en Repsol y Repsol tiene un accidente, pierdes. Al añadir más activos descorrelacionados, este riesgo se diluye hasta casi desaparecer.

**Riesgo sistemático (de mercado)** — común a todos los activos: recesiones, guerras, pandemias. No desaparece diversificando porque todos los activos caen a la vez. Este es el riesgo que el CAPM (tema 14) va a medir y a pagar.

En el límite, con $n$ activos iguales con correlación $\rho$:

$$\sigma_P^2 = \frac{\sigma^2}{n} + \frac{n-1}{n}\rho\sigma^2 \xrightarrow{n\to\infty} \rho\sigma^2$$

El primer término desaparece (riesgo específico eliminado). El segundo persiste (riesgo sistemático).

### Varianza de cartera

Para una cartera con pesos $w_i$:

$$\sigma_P^2 = \mathbf{w}^T \mathbf{\Sigma} \mathbf{w}$$

Expandido para dos activos B y E:

$$\sigma_P^2 = w_B^2\sigma_B^2 + w_E^2\sigma_E^2 + 2w_Bw_E\,\text{Cov}(r_B, r_E)$$

El término clave es la **covarianza**. Si $\rho_{BE} < 0$, la varianza de la cartera puede caer por debajo de la varianza de cualquiera de los activos individuales. Por eso los bonos y las acciones se han combinado históricamente bien.

### Frontera eficiente de Markowitz (1952)

Al variar los pesos de todos los activos disponibles, obtienes el **conjunto de oportunidades de activos de riesgo (OSRA)**: todos los portfolios posibles en el espacio ($\sigma_P$, $E(r_P)$).

Dentro del OSRA:
- **Frontera eficiente:** la parte superior. Para cada nivel de riesgo, el portfolio con máximo retorno esperado.
- **Portfolio de mínima varianza (MV):** el punto más a la izquierda.
- **Frontera ineficiente:** la parte inferior — mismo riesgo, menos retorno.

### Capital Allocation Line (CAL) y Sharpe ratio

Combinando el portfolio de riesgo $P$ con el activo libre de riesgo:

$$E(r_C) = r_f + \frac{E(r_P) - r_f}{\sigma_P} \cdot \sigma_C = r_f + S_P \cdot \sigma_C$$

La pendiente de esta línea es el **Sharpe ratio**:

$$S_P = \frac{E(r_P) - r_f}{\sigma_P}$$

Retorno en exceso por unidad de riesgo. La métrica más usada en la industria para comparar gestores y fondos. El portfolio óptimo maximiza el Sharpe ratio.

### Portfolio completo óptimo

El inversor reparte entre el portfolio óptimo $P$ y el activo libre de riesgo en proporción:

$$y^* = \frac{E(r_P) - r_f}{\lambda \sigma_P^2}$$

A mayor aversión al riesgo ($\lambda$ alto), menor fracción en activos de riesgo.

---

## Tema 10: Inversión Más Allá de Media-Varianza

### La idea central

Media y varianza describen completamente la distribución solo bajo normalidad. El tema 8 demostró que los retornos no lo son. Tres criterios alternativos que no dependen de ese supuesto.

### 1. Criterio de la Media Geométrica (GMR)

La media aritmética sobreestima el crecimiento real porque ignora el compounding. La corrección:

$$r_g \approx \bar{r} - \frac{1}{2}\sigma^2$$

Un activo con $\bar{r} = 18.4\%$ y volatilidad alta puede tener $r_g = 2.9\%$ — el crecimiento real anual. Maximizar la GMR equivale a maximizar la utilidad logarítmica en contexto multiperiodo.

### 2. Criterios de Seguridad Primero (Safety-First)

Fijan un retorno mínimo tolerable $r_L$ y/o probabilidad máxima de caer bajo él ($\alpha$). Los tres criterios bajo normalidad:

| Criterio | Qué fija | Qué optimiza | Ranking ejemplo |
|---|---|---|---|
| Roy | $r_L$ | Minimiza $\text{Prob}(r < r_L)$ | B > C > A > D |
| Kataoka | $\alpha$ | Maximiza $r_L$ | D > C > B > A |
| Telser | $r_L$ y $\alpha$ | Maximiza $E(r)$ | C > B |
| Sharpe ratio | — | Maximiza ratio exceso/riesgo | A > C > D > B |

Roy con $r_L = r_f$ produce exactamente el mismo portfolio óptimo que el Sharpe ratio. Los rankings divergen — la elección depende de qué define "desastre" para el inversor.

### 3. Dominancia Estocástica

Compara distribuciones completas sin asumir normalidad ni función de utilidad concreta.

- **FSD:** A domina a B si $F_A(r) \leq F_B(r)$ para todo $r$. Cualquier inversor prefiere A independientemente de su aversión al riesgo.
- **SSD:** integra las diferencias de CDFs; válido para inversores aversos al riesgo ($U'' < 0$). Bajo normalidad, el conjunto SSD-eficiente coincide con la frontera de Markowitz.
- **TSD:** añade aversión al riesgo absoluta decreciente. Reduce aún más el conjunto eficiente.

**Jerarquía:** FSD-eficiente ⊇ SSD-eficiente ⊇ TSD-eficiente. Ventaja: no asume distribución específica. Inconveniente: comparaciones por pares computacionalmente prohibitivas con muchos activos — uso principalmente académico.

---

## Lo más importante para recordar

**1. Los log-retornos son el lenguaje cuantitativo de las finanzas.**
Todo modelo de precios, backtesting y estimación de parámetros usa log-retornos. La capitalización continua conecta con Black-Scholes; la suma temporal conecta con la eficiencia computacional.

**2. Los retornos no son normales. Siempre.**
Skewness negativa y kurtosis > 3 son universales. Mezclas de normales y saltos de Poisson son las explicaciones más convincentes. La pregunta correcta ante cualquier modelo no es "¿funciona en promedio?" sino "¿qué pasa en el percentil 1%?".

**3. La diversificación elimina riesgo específico gratis — hasta el riesgo sistemático.**
Añadir activos descorrelacionados reduce el riesgo sin coste en retorno esperado. El riesgo sistemático no desaparece. Distinguir ambos tipos es la base del CAPM.

**4. El Sharpe ratio y la GMR son las dos métricas de comparación más usadas.**
Sharpe ratio para comparación en un período; media geométrica para evaluar estrategias multiperiodo. La GMR penaliza la volatilidad automáticamente — un activo muy volátil puede destruir riqueza aunque tenga media aritmética alta.

**5. Los criterios safety-first son el puente entre teoría y gestión de riesgo real.**
En la práctica, gestoras, pensiones y reguladores piensan en términos de pérdidas máximas tolerable (Roy/Kataoka) o retorno mínimo garantizado — no en utilidad abstracta. El criterio de Roy con $r_L = r_f$ produce exactamente el mismo portfolio óptimo que el Sharpe ratio.

**6. Media-varianza es el punto de partida, no el final.**
La dominancia estocástica demuestra que hay portfolios Markowitz-eficientes que no maximizan la utilidad esperada cuando los retornos son no normales. En la práctica, los modelos avanzados corrigen con CVaR, distribuciones t o mezclas.

# Markowitz, CAL y Sharpe ratio

---

## Para qué sirve este bloque

Toda decisión de inversión tiene dos preguntas: cuánto puedo ganar y cuánto puedo perder. Markowitz formaliza eso. La CAL y el Sharpe ratio resuelven qué pasa cuando añades una opción sin riesgo a la mezcla.

---

## Markowitz: la nube de posibilidades

Tienes un universo de $m$ activos de riesgo. Quieres construir un portfolio eligiendo $n$ de ellos y asignando pesos $(w_1, w_2, ..., w_n)$ que sumen 100%.

Para cada combinación de activos y pesos puedes calcular:

- **Retorno esperado** del portfolio: media ponderada de los retornos individuales
- **Riesgo** del portfolio: varianza que depende de los pesos y de las correlaciones entre activos

$$\sigma_P^2 = \mathbf{w}^T \mathbf{\Sigma} \mathbf{w}$$
```python
# Expected portfolio return
np.sum(weights * log_returns.mean()) * 250
# Expected Portfolio Variance
np.dot(weights.T, np.dot(log_returns.cov() * 250, weights))
# Expected Portfolio Volatility
np.sqrt(np.dot(weights.T, np.dot(log_returns.cov() * 250, weights)))
```

Si simulas todas las combinaciones posibles de activos y pesos, obtienes una nube de puntos en el espacio (riesgo, retorno). Cada punto es un portfolio distinto.

```
E(r)
 |          * frontera eficiente
 |        *
 |      * *  (nube interior — posibles pero subóptimos)
 |    *
 |  * (mínima varianza)
 |___________________________
                            σ
```

La **frontera eficiente** es el borde superior de esa nube: para cada nivel de riesgo, el portfolio con mayor retorno esperado. Todo lo que está por debajo de la frontera es dominado — mismo riesgo, menos retorno. Se descarta.

El resultado de Markowitz no es un portfolio único sino una frontera: una curva de opciones óptimas. Qué punto de esa curva eliges depende de tu aversión al riesgo.

### Por qué la frontera es curva

Cuando combinas dos activos de riesgo, la varianza del resultado no es la suma de sus varianzas: depende de la correlación entre ellos. Esa dependencia no lineal es lo que hace que la frontera sea curva, no una recta. A menor correlación entre activos, más a la izquierda puede llegar la frontera — menor riesgo para el mismo retorno. Eso es la diversificación.

---

## Añades un activo sin riesgo — y el problema cambia de forma

Un bono del Estado o una cuenta garantizada paga un tipo fijo $r_f$ con riesgo cero: $\sigma = 0$, correlación 0 con todo. En la práctica, $r_f$ no es algo que elijas — es el tipo que fija el banco central (BCE, Fed), observable y disponible para todos. Representa el coste de oportunidad de invertir: si no haces nada, el mercado ya te da $r_f$ gratis. Cualquier activo de riesgo tiene que justificar el riesgo adicional frente a ese punto de referencia.

Ahora tu decisión ya no es solo "qué mezcla de activos de riesgo elijo" sino:

> **¿Cuánto de mi dinero pongo en activos de riesgo y cuánto en el activo sin riesgo?**

Podrías meter el activo sin riesgo directamente en Markowitz, pero matemáticamente el modelo colapsa: como el bono tiene varianza y covarianza cero, la no-linealidad que generaba la curva desaparece. Cualquier mezcla entre el bono y un portfolio de riesgo escala de forma perfectamente lineal — en retorno y en riesgo. El resultado no es una curva sino una recta.

---

## La CAL: la línea bono–portfolio

Elige un portfolio cualquiera $P$ de la frontera eficiente. En el gráfico está en el punto $(\sigma_P,\ E(r_P))$, por ejemplo $(15\%,\ 9\%)$.

El bono está en el eje Y, en el punto $(0,\ r_f)$, por ejemplo $(0,\ 3\%)$ — riesgo cero, retorno garantizado.

Si mezclas bono y $P$ en distintas proporciones, obtienes todos los puntos entre esos dos extremos. Como ambos escalan linealmente, forman una **recta**. Esa recta es la **Capital Allocation Line (CAL)** para el portfolio $P$.

```
E(r)
 |
9%|              * P
 |            /
 |          /
3%|* bono  /
 |      /
 |____/___________
      0%    15%    σ
```

Moviéndote a lo largo de esta recta:
- En el extremo izquierdo (todo en bono): $r_f$, riesgo 0
- En el extremo derecho (todo en $P$): retorno y riesgo de $P$
- En el medio: proporcional al peso que pones en cada uno
- Más allá de $P$ (apalancamiento): pides prestado al tipo $r_f$ e inviertes más del 100% en $P$

---

## El Sharpe ratio: la pendiente de la recta

Puedes trazar esa recta desde el bono hacia cualquier portfolio de la frontera eficiente. Cada uno da una recta distinta. La pregunta es: ¿cuál es mejor?

La más empinada. Para cualquier nivel de riesgo que decidas asumir, la recta más empinada te da más retorno. Y como todas las rectas salen del mismo punto (el bono), "más empinada" equivale exactamente a "más retorno por unidad de riesgo añadida".

Eso es el **Sharpe ratio**: la pendiente de la recta bono–$P$.

$$S_P = \frac{E(r_P) - r_f}{\sigma_P}$$

El numerador es el retorno en exceso sobre el bono — lo que ganas de más por asumir riesgo. El denominador es la unidad de riesgo. Sharpe ratio = precio del riesgo para ese portfolio.

---

## Dos decisiones separadas

Aquí está la distinción clave:

**Decisión 1 — ¿Qué portfolio de riesgo elijo?**
De todos los portfolios en la frontera eficiente, el mejor es el de mayor Sharpe ratio. Es el punto donde la recta desde el bono es tangente a la curva de Markowitz — la recta más empinada posible que todavía toca la frontera.

```
E(r)
 |            / ← recta óptima (tangente a la frontera en T)
 |          T ← portfolio tangente
 |        * /\
 |      *  /  P2 ← otra recta, menos empinada
 |    *   /
3%|*   /
 |/__________________
  0                 σ
```

**Decisión 2 — ¿Cuánto pongo en $T$ vs. en el bono?**
Una vez elegido el portfolio tangente $T$, tu aversión al riesgo determina en qué punto de la recta te sitúas:

$$y^* = \frac{E(r_T) - r_f}{\lambda \cdot \sigma_T^2}$$

- Inversor conservador ($\lambda$ alto): $y^*$ pequeño → mucho en bono, poco en $T$
- Inversor agresivo ($\lambda$ bajo): $y^*$ grande → mucho en $T$, puede llegar al apalancamiento

### El resultado más poderoso

Todos los inversores racionales mantienen el **mismo portfolio de activos de riesgo** — el tangente $T$. Lo que varía entre inversores es cuánto ponen ahí. Esto es el **Teorema de Separación de Tobin**: la elección del portfolio de riesgo óptimo es independiente de la aversión al riesgo.

---

## Conexión con lo que viene

| Concepto | Aparece después en |
|---|---|
| Portfolio tangente $T$ | Si el CAPM es cierto, $T$ = índice de mercado (Tema 14) |
| Sharpe ratio | Evaluación de gestores, alpha de Jensen |
| $\lambda$ y el reparto $y^*$ | Base del modelo de utilidad esperada |
| Activo libre de riesgo $r_f$ | Input directo de Black-Scholes ($e^{-r_f T}$) |

## Tema 11 — Fixed Income

### Terminología y estructura de un bono
- **Par (face value):** importe del préstamo, devuelto en su totalidad al vencimiento.
- **Cupón:** pago periódico de intereses = tasa cupón × par.
- **Zero-coupon bond:** solo paga el par al vencimiento (p.ej. T-bills, strips).
- Los detalles constan en el **bond indenture**.

### Características del bono
| Tipo | Beneficia a | Mecanismo |
|---|---|---|
| Floating rate | Inversor | Interés ligado a tasas actuales → menor sensibilidad a tipos |
| Indexed bond | Inversor | Par varía con inflación |
| Interest rate put | Inversor | Fuerza recompra si tipos suben |
| Convertible | Inversor | Reembolso en equity a elección del inversor |
| Interest rate call | Emisor | Rescata el bono si tipos bajan |
| Sinking fund | Emisor | Amortiza parcialmente a lo largo del tiempo |
| Asset-backed | Emisor | Traslada riesgo de préstamos a inversores (p.ej. MBS) |
| Catastrophe bond | Emisor | Paga menos si ocurre un evento catastrófico |

### Valoración
**Precio justo** (pago anual, tasa constante r, vencimiento T):

$$\text{Bond value} = \frac{\text{par}}{(1+r)^T} + \frac{\text{cupón}}{r}\left[1 - \frac{1}{(1+r)^T}\right]$$

- **Dirty price** = precio limpio + interés acumulado (accrued interest).
- **Accrued interest** = cupón × (días desde último cupón / días entre cupones).
- Convención daycount: 30/360 (deuda soberana EE.UU.) o Actual/365 (corporativos, algunos países).

### Yields
- **YTM (Yield to Maturity):** retorno anual si se mantiene hasta vencimiento; es el r que iguala precio de mercado con precio teórico.
- **Current yield** = cupón anual / precio actual.
- Otras: yield to call, yield to put.

### Sensibilidad a tipos de interés
- Tipos ↑ → precios ↓ (relación inversa).
- Bonos de mayor vencimiento son más sensibles.
- **DV01:** cambio en precio por 1 bp de variación en yield.
- **Duration (Macaulay):** media ponderada (por PV) de los flujos de caja — proxy de la sensibilidad.
- **Modified duration D\*:** % de variación del precio ante variación en yield.
- **Convexidad:** segunda derivada del precio respecto al yield; cuantifica la no-linealidad. Permite ajuste de Taylor de orden 2:

$$\frac{\Delta P}{P_0} \approx -D^* \Delta y + \frac{\text{convexity}}{2}(\Delta y)^2$$

- **Convexidad negativa:** bonos callable (el emisor los rescata si tipos bajan → el precio tiene techo).

### Riesgos y elementos de mercado
- **Default:** insolvencia de balance, insolvencia de flujo de caja o default estratégico.
- **Covenants protectores:** subordinación, cross-default, restricciones de dividendos, restricciones de activos.
- **Credit spread:** diferencia de yield respecto a deuda soberana equivalente. TED spread > 50 bp → señal de crisis.
- **High yield (junk):** bonos sub-investment grade; se comportan parcialmente como equity.
- **Liquidez:** bonos on-the-run vs off-the-run; diferencia de yield puede ser decenas de bp.
- **Repo:** venta + recompra de activos como garantía de un préstamo de cash. Haircut = margen de seguridad del prestamista.

---

## Tema 12 — Yield Curves

### Estructura temporal y tipos de tasas
- **Spot rates (zero rates):** yield de bonos cupón-cero a cada plazo.
- **Forward rates:** tipos acordados hoy para un préstamo que empieza en el futuro.
- **Short rates:** tasas a corto plazo vigentes hoy.
- La curva de rendimiento (*yield curve*) representa yields vs plazos para deuda soberana.

### Formas de la curva y señales macro
| Forma | Señal habitual |
|---|---|
| Upward sloping (suave) | Economía estable, crecimiento |
| Inverted | Expectativas de desaceleración/recesión |
| Humped | Defensa de divisa; gobierno sube tipos medios para retener inversores |

- Factores Litterman-Scheinkman: **nivel**, **pendiente**, **curvatura** (shift, twist, bow).

### Bootstrapping
Para construir la curva zero a partir de bonos con cupón: usar spot rates conocidos para despejar el siguiente spot rate desconocido iterativamente (de corto a largo plazo).

### Teorías de la estructura temporal
1. **Expectations hypothesis:** las tasas forward predicen las tasas cortas futuras.
2. **Liquidity preference:** los inversores exigen prima por comprometer liquidez → forward rates > E(tasas cortas).
3. **Market segmentation:** inversores con horizontes distintos y sin sustitución entre tramos.
4. **Preferred habitat:** como la anterior, pero con sustitución si hay precio suficiente.

### Política monetaria
- Los bancos centrales operan principalmente sobre el extremo corto de la curva (tipo overnight).
- Desde 2008: operaciones de mercado abierto en tramos largos (QE) y activos de riesgo.
- **Doble mandato Fed:** estabilidad de precios + máximo empleo (post-2008 añade estabilidad financiera).

### Modelos de curva
- **Vasicek:** proceso Ornstein-Uhlenbeck para la tasa corta: $dr_t = \kappa(\bar{r} - r_t)dt + \sigma dW_t$
- **Nelson-Siegel / Svensson:** factores de nivel, pendiente y curvatura (uno o dos jorobas).

---

## Tema 13 — Equity Valuation

### Análisis sectorial e industrial
- **DOL (Degree of Operating Leverage)** = 1 + costes fijos / beneficios → mide sensibilidad al ciclo.
- Software: DOL alto (costes fijos altos, variables bajos). Construcción: DOL bajo.
- **Sector rotation:** sobreponderar defensivos / infraponderar cíclicos al entrar en contracción.
- Codificaciones de industria: NAICS, UKSIC, NACE, ISIC.

### Análisis fundamental y comparables
- Ratios: **P/E**, **P/B** (book), **P/CF** (cashflow), **P/S** (sales).
- Limitaciones del P/E: earnings gestionables, no sirve para startups, inestable en cíclicas.
- **Tobin's q** = precio de mercado / coste de reposición de activos → tiende a 1 por competencia.

### Modelos de valoración por descuento

**DDM básico** (H años):
$$V_0 = \sum_{t=1}^{H} \frac{D_t}{(1+k)^t} + \frac{P_H}{(1+k)^H}$$

**Gordon-Shapiro (crecimiento constante g)**:
$$V_0 = \frac{D_1}{k - g} \quad \Rightarrow \quad k = \frac{D_1}{P_0} + g$$

- Reinversión: si ROE > k, tiene sentido no pagar todo como dividendo.
- $g = b \times \text{ROE}$ donde $b$ = fracción de beneficios retenida.
- **DuPont:** ROE = margen neto × rotación de activos × multiplicador de equity.
- **DDM multiestage:** modela el ciclo de vida de la empresa (crecimiento alto → madurez → terminal).

**Free Cashflow to the Firm (FCFF)**:
$$\text{FCFF} = \text{EBIT}(1-\tau) + \text{amortización} - \text{capex} - \Delta\text{NWC}$$
$$V_0^{\text{firma}} = \sum_t \frac{\text{FCFF}_t}{(1+\text{WACC})^t}$$

$$\text{WACC} = w_e r_e + (w_b r_b + w_l r_l)(1-\tau)$$

**FCFE** (Free Cashflow to Equity) = FCFF − intereses(1−τ) + variación neta de deuda.

**Comparación de modelos:** en teoría (Modigliani-Miller) todos dan el mismo valor; divergen por incertidumbre en inputs, impuestos, fricciones y no-constancia de rf.

### Corrección por desigualdad de Jensen
Cuando se estiman $\hat{k}$ y $\hat{g}$ con incertidumbre, la valoración debe corregirse:
$$\hat{V}_0 \approx \frac{\hat{D}}{\hat{k}-\hat{g}} + \frac{\hat{D}}{(\hat{k}-\hat{g})^3}(\sigma^2_k + \sigma^2_g - 2\,\text{Cov}(\hat{k},\hat{g}))$$

### PVGO y P/E
$$\text{PVGO} = P_0 - \frac{E_1}{k} \quad;\quad \frac{P_0}{E_1} = \frac{1}{k}\left(1 + \frac{\text{PVGO}}{E_1/k}\right)$$

- Si PVGO = 0, la acción se valora como una renta perpetua.
- Regla rápida: P/E / g < 1 → acción atractiva.

## Tema 14 — Capital Asset Pricing Model (CAPM)

### Notación
| Símbolo | Significado |
|---|---|
| $r_i$ | retorno del activo i |
| $r_M$ | retorno del portfolio de mercado |
| $r_f$ | tasa libre de riesgo |
| $R_i = r_i - r_f$ | exceso de retorno |
| $\beta_i$ | sensibilidad al factor de mercado |
| $\alpha_i$ | retorno anormal / inexplicado |

### Single-Index Model
$$R_{i,t} = \alpha_i + \beta_i R_{M,t} + \varepsilon_{i,t}$$

- **Ventaja:** reduce inputs de $\frac{n(n+3)}{2}$ a $3n+3$ (para 50 activos: 1.325 → 153 estimaciones).
- **Limitación:** no captura correlaciones idiosincrásicas entre pares.

### CAPM (Sharpe-Lintner-Mossin, 1964-1966)
**Supuestos:** muchos inversores price-takers, sin impuestos ni costes, horizonte único, maximización media-varianza, expectativas homogéneas.

**Resultado de equilibrio:** todos los inversores sostienen el mismo portfolio de riesgo = portfolio de mercado M. La Capital Market Line (CML) = Capital Allocation Line (CAL).

**Ecuación CAPM:**
$$E(r_i) - r_f = \beta_i [E(r_M) - r_f] \quad ;\quad \beta_i = \frac{\text{Cov}(r_i, r_M)}{\sigma^2_M}$$

- **Security Market Line (SML):** plot de $E(r_i)$ vs $\beta_i$. Activos por encima → alpha positivo (infravalorados). Por debajo → alpha negativo.

### Limitaciones del CAPM
- **Teóricas:** un solo factor de riesgo es insuficiente; los inversores no son todos media-varianza; equilibrio puede no existir.
- **Empíricas:** el portfolio de mercado verdadero es desconocido; heteroscedasticidad; correlación serial; betas pasados predicen mal betas futuros.

### Mejoras del CAPM
- **Betas ajustados:** Blume ($\hat{\beta}_i = \frac{1}{3} + \frac{2}{3}\hat{\beta}_i^{\text{hist}}$) o Vasicek (shrinkage bayesiano).
- **Conditional CAPM:** betas varían con el ciclo macroeconómico (Rothschild-Harvey).
- **Intertemporal CAPM (ICAPM, Merton):** añade factor de estado económico.
- Incluir capital humano o empresas privadas mejora el ajuste.

### Hedging y alpha portátil
- Portfolio de tracking T replica el $\beta$ de P usando el índice + T-bills.
- Posición larga en P + corta en T → market neutral → aísla el alpha.
- **Zero-beta portfolio (Black):** cuando no hay activo libre de riesgo, la tangente a la frontera en M define una tasa implícita $r_z$ → versión Black del CAPM.

---

## Tema 15 — Factor Models y Arbitrage Pricing Theory (APT)

### Motivación
Un solo factor de mercado es insuficiente → modelos multifactor.

**Modelo general multifactor:**
$$R_i = \alpha_i + \beta_{i,1}F_1 + \beta_{i,2}F_2 + \ldots + \beta_{i,k}F_k + \varepsilon_i$$

### APT (Ross, 1976)
Tres supuestos:
1. Los retornos se describen por un modelo factorial.
2. El riesgo idiosincrásico se puede diversificar.
3. Los mercados no permiten arbitraje persistente.

**Implicación:** $R_i \approx \beta_{i,1}F_1 + \ldots + \beta_{i,k}F_k$ (sin alpha en equilibrio).

**Arbitraje:**
- *Relativo:* dos portfolios bien diversificados con igual exposición a factores pero diferente retorno esperado → comprar barato, vender caro.
- *Absoluto:* un portfolio con retorno observado mayor que el predicado por los factores → construir portfolio arb con T-bills y tracking portfolios.

**Dominancia vs arbitraje:** el APT se apoya en pocos agentes que toman posiciones grandes (cierre rápido del desequilibrio), más robusto que el argumento de dominancia del CAPM.

### Factores macro
**Chen-Roll-Ross (5 factores):**
- Crecimiento producción industrial (%IP)
- Inflación esperada E(i)
- Sorpresa de inflación (Δi − E(i))
- Cambio en credit spread corporativo (CMG)
- Cambio en pendiente de la curva (LMS)

**Modelos para hedge funds:** Hasanhodzic-Lo (6 factores), Fung-Hsieh (7 y 8 factores).

### Factores micro
- **ARCH/GARCH-in-mean:** volatilidad actual afecta a retornos.
- **Liquidity CAPM (Acharya-Pedersen):** diferencial bid-ask como factor de riesgo.
- **Pastor-Stambaugh:** sorpresa en volumen en dólares como proxy de liquidez.

### Factores de estilo
- **Fama-French 3 factores:** mercado (RM), tamaño (SMB: small minus big), valor (HML: high minus low book/price).
- **Carhart 4 factores:** añade momentum (WML: winners minus losers).
- **Fama-French 5 factores:** añade rentabilidad (RMW) e inversión (CMA).

**¿Son reales estos factores?**
- SMB probablemente relacionado con credit spreads y small-cap.
- HML activo principalmente alrededor de anuncios de beneficios.
- WML posiblemente news sentiment o sorpresa en desempleo.
- Harvey-Liu-Zhu: solo son robustos estadísticamente el mercado, HML, momentum, consumo duradero, volatilidad a corto plazo y liquidez.

### Límites del arbitraje
- **Huberman-Stanzl:** los mercados no permiten quasi-arbitraje (coste de entrada ≈ coste de salida).
- **"Siamese Twin" shares:** evidencia de que el APT no es exacto.
- Otros frenos: model risk, fundamental risk, restricciones de crédito, segmentación de mercado.

# Módulo 7 — Temas 18 a 21: Valoración II — Derivados y Pricing de Opciones

## Para qué sirve este bloque

Los temas anteriores del módulo establecieron cómo medir el riesgo (temas 6-10) y cómo valorar activos bajo modelos de equilibrio como CAPM (temas 11-17). Este bloque da el siguiente paso: cómo valorar instrumentos cuyo precio no depende directamente de un activo, sino del derecho a comprarlo o venderlo en el futuro. Eso es un **derivado financiero**: un contrato cuyo valor se deriva del comportamiento de otro activo subyacente.

La pregunta central que responde este bloque es: ¿cuánto vale hoy la posibilidad de comprar una acción a un precio fijado dentro de un año? La respuesta requiere dos herramientas: la **fórmula de Black-Scholes** (solución analítica) y la **discretización de Euler con Monte Carlo** (solución numérica). Ambas producen el mismo resultado por caminos distintos, lo que refuerza la robustez del resultado.

---

## Tema 18: Introducción a los contratos derivados

### La idea central

Un derivado no tiene valor propio: su precio depende del comportamiento de un activo subyacente (una acción, un índice, un tipo de cambio). Surgieron como instrumentos de cobertura — para proteger posiciones ante movimientos adversos de precios — pero hoy los usan también especuladores y arbitrajistas.

### Los cuatro tipos principales

**Forward**: contrato privado entre dos partes para intercambiar un activo en una fecha futura a un precio pactado hoy. No cotiza en bolsa, no está estandarizado, y genera exposición de crédito bilateral (si una parte incumple, la otra sufre el daño). Se usa principalmente para cubrir riesgos de tipo de cambio o de materias primas.

**Futuro**: equivalente al forward pero estandarizado y negociado en mercados regulados. La estandarización reduce el riesgo de contraparte (la cámara de compensación actúa como intermediario), pero elimina flexibilidad. El comprador asume la obligación de adquirir el subyacente en la fecha de vencimiento; el vendedor, de entregarlo.

**Opción**: a diferencia del forward y el futuro, la opción da un **derecho, no una obligación**. Una *call* (opción de compra) da al titular el derecho a comprar el subyacente al precio de ejercicio (*strike price*) antes o en la fecha de vencimiento. Una *put* (opción de venta) da el derecho a venderlo. El vendedor de la opción sí tiene la obligación de cumplir si el comprador ejerce. Por asumir esa obligación, el vendedor cobra una prima.

**Swap**: acuerdo para intercambiar flujos de caja futuros según condiciones pactadas. El caso más común es el *interest rate swap*: una parte paga tipo fijo y recibe tipo variable. Se usan para gestionar exposición a tipos de interés, divisas, o para aprovechar ventajas comparativas en distintos mercados de deuda.

La diferencia estructural entre estos cuatro contratos no es trivial: forward y futuros obligan a ambas partes; opciones dan flexibilidad unilateral al comprador a cambio de una prima; swaps redistribuyen flujos recurrentes en lugar de un único intercambio.

---

## Tema 19: Valoración de opciones — Fórmula de Black-Scholes

### La idea central

Black, Scholes y Merton (1973) resolvieron el problema de cuánto vale hoy una opción europea (solo ejercible al vencimiento). Su fórmula da un precio analítico exacto bajo un conjunto de supuestos: mercados eficientes, sin costes de transacción, sin dividendos, volatilidad y tasa libre de riesgo conocidas y constantes, y precios del subyacente que siguen una distribución lognormal.

### La fórmula

El precio de una *call* europea es:

$$C = S \cdot N(d_1) - K \cdot e^{-rT} \cdot N(d_2)$$

donde:

$$d_1 = \frac{\ln(S/K) + (r + \sigma^2/2) \cdot T}{\sigma \sqrt{T}}, \qquad d_2 = d_1 - \sigma\sqrt{T}$$

Los símbolos son: $S$ = precio actual del subyacente, $K$ = precio de ejercicio (*strike*), $r$ = tasa libre de riesgo, $\sigma$ = volatilidad anualizada del subyacente, $T$ = tiempo hasta vencimiento en años, $N(\cdot)$ = función de distribución acumulada normal estándar.

**¿Qué calcula cada parte?** El término $S \cdot N(d_1)$ es el valor esperado de lo que recibes si ejerces la opción (el activo, ponderado por la probabilidad de que valga la pena ejercerla). El término $K \cdot e^{-rT} \cdot N(d_2)$ es el valor presente de lo que pagas al ejercerla. La diferencia es el valor neto de la opción hoy.

$N(d_1)$ y $N(d_2)$ son probabilidades, obtenidas con la función de distribución acumulada normal (en Python, `scipy.stats.norm.cdf()`). $N(d_2)$ es la probabilidad de que la opción termine *in the money* (precio de mercado > strike al vencimiento). $N(d_1)$ pondera adicionalmente el tamaño del beneficio.

### Implementación en Python

```python
import numpy as np
from scipy.stats import norm

def d1(S, K, r, stdev, T):
    return (np.log(S / K) + (r + stdev**2 / 2) * T) / (stdev * np.sqrt(T))

def d2(S, K, r, stdev, T):
    return (np.log(S / K) + (r - stdev**2 / 2) * T) / (stdev * np.sqrt(T))

def BSM(S, K, r, stdev, T):
    return S * norm.cdf(d1(S, K, r, stdev, T)) - K * np.exp(-r * T) * norm.cdf(d2(S, K, r, stdev, T))
```

Para Procter & Gamble en abril 2017: $S = 88.12$, $K = 110$, $r = 2.5\%$, $\sigma = 0.176$, $T = 1$ año → precio de la call ≈ **$1.13**.

La diferencia entre $d_1$ y $d_2$ en el código es que $d_1$ suma $\sigma^2/2$ y $d_2$ la resta. Esto corresponde al ajuste de Itô en el logaritmo del precio esperado.

---

## Tema 20: Monte Carlo con Black-Scholes

### La idea central

Antes de pasar a Euler, el material presenta Monte Carlo aplicado directamente al movimiento browniano geométrico que subyace a Black-Scholes. El objetivo es simular miles de trayectorias del precio del subyacente y estimar el precio de la opción como el promedio descontado de los payoffs simulados. Es conceptualmente más intuitivo que la fórmula cerrada, aunque computacionalmente más costoso.

El precio del subyacente evoluciona como movimiento browniano geométrico:

$$S_T = S_0 \cdot e^{(r - \frac{\sigma^2}{2})T + \sigma\sqrt{T} \cdot Z}$$

donde $Z \sim N(0,1)$ es un shock aleatorio. Se generan miles de valores de $Z$, se calcula $S_T$ para cada uno, y el precio de la call es:

$$C = e^{-rT} \cdot \mathbb{E}[\max(S_T - K, 0)]$$

El resultado converge al valor de Black-Scholes a medida que aumenta el número de simulaciones.

---

## Tema 21: Discretización de Euler con Monte Carlo

### La idea central

La fórmula cerrada de Black-Scholes funciona para opciones europeas simples. Para instrumentos más complejos (opciones americanas, opciones barrera, productos estructurados con condiciones path-dependent), no existe solución analítica. La **discretización de Euler** resuelve esto simulando la trayectoria completa del precio paso a paso, no solo el valor final.

### La fórmula de Euler

En lugar de simular directamente $S_T$, se aproxima la evolución del precio en pequeños intervalos de tiempo $\Delta t$:

$$S_t = S_{t-1} \cdot e^{(r - \frac{\sigma^2}{2})\Delta t + \sigma \sqrt{\Delta t} \cdot Z_t}$$

donde cada $Z_t \sim N(0,1)$ es independiente. Esto discretiza la ecuación diferencial estocástica de Black-Scholes en pasos diarios (o del tamaño que se elija).

### Implementación en Python

```python
T = 1.0
t_intervals = 250          # días de trading
delta_t = T / t_intervals
iterations = 10000         # simulaciones

Z = np.random.standard_normal((t_intervals + 1, iterations))
S = np.zeros_like(Z)
S[0] = S0                  # precio inicial

for t in range(1, t_intervals + 1):
    S[t] = S[t-1] * np.exp((r - 0.5 * stdev**2) * delta_t
                           + stdev * delta_t**0.5 * Z[t])

# Payoff y precio de la call
p = np.maximum(S[-1] - K, 0)
C = np.exp(-r * T) * np.sum(p) / iterations
```

Para los mismos parámetros de P&G: resultado ≈ **$1.16**, frente a $1.13 de Black-Scholes. La diferencia (~2.5%) es pequeña pero no nula: depende de la semilla aleatoria y del número de simulaciones. Con más iteraciones, converge.

### Por qué Euler es más potente

La diferencia no está en la precisión para opciones europeas simples (donde Black-Scholes es exacto), sino en la generalidad: Euler puede simular cualquier proceso estocástico, incluyendo varianza estocástica, saltos, o condiciones que dependen de toda la trayectoria del precio. Por eso se usa como base en modelos de riesgo avanzados.

---

## Lo más importante para recordar

1. **Un derivado vale por el derecho que otorga, no por el subyacente en sí.** Una call vale $\max(S_T - K, 0)$: solo tiene valor si el precio de mercado supera el strike. Este payoff asimétrico es la esencia de las opciones.

2. **Black-Scholes convierte la incertidumbre futura en un precio presente.** $N(d_1)$ y $N(d_2)$ son probabilidades que resumen toda la distribución de posibles precios futuros en dos números. La fórmula es exacta bajo sus supuestos, pero los supuestos (volatilidad constante, sin dividendos, mercados completos) son aproximaciones.

3. **Monte Carlo y Euler dan el mismo resultado que Black-Scholes para opciones europeas.** Que las tres rutas converjan al mismo número (~$1.13–1.16) es una validación, no una redundancia. En la práctica, se usa la solución analítica cuando existe y Euler cuando no.

4. **La discretización de Euler aproxima la EDE paso a paso.** Esto permite modelar cualquier proceso estocástico, no solo el lognormal. Es la base de los modelos de valoración de derivados exóticos y de la simulación de escenarios de riesgo.

5. **La volatilidad es el input más crítico de Black-Scholes.** El precio del subyacente y el strike son observables; la tasa libre de riesgo está dada por el mercado. La volatilidad ($\sigma$) hay que estimarla — históricamente o implícita del mercado — y pequeñas diferencias en $\sigma$ generan grandes diferencias en el precio de la opción.

# Módulo 8 — Temas 22 a 24: Gestión de Carteras de Inversión

## Para qué sirve este bloque

El módulo 7 terminó con cómo valorar una opción: Black-Scholes y Euler dan su precio teórico. Este bloque responde las preguntas que siguen: ¿cómo gestionas el riesgo de una posición en opciones una vez que la has vendido? (T22), ¿cómo funciona la volatilidad en los mercados reales, donde el supuesto de BSM claramente falla? (T23), y ¿cómo construyes y gestionas activamente un portfolio buscando rentabilidad por encima del benchmark? (T24).

Los tres temas son independientes en su técnica pero comparten un eje común: la distancia entre los modelos teóricos y cómo operan los mercados de verdad.

### Recall: definición Opción
Una opción es un contrato que te da el **derecho** (pero no la obligación) de comprar o vender un activo a un precio fijado de antemano, en una fecha futura.

Por ejemplo: hoy una acción de Repsol vale 15€. Compras una opción que te da derecho a comprarla a 15€ dentro de tres meses. Si dentro de tres meses la acción vale 20€, ejerces la opción — la compras a 15€ y ganas 5€. Si vale 12€, no la ejerces y pierdes solo lo que pagaste por la opción.

Hay dos tipos básicos:
- **Call:** derecho a comprar.
- **Put:** derecho a vender.

Y quien vende la opción (la institución financiera del Tema 22) asume la obligación contraria: tiene que venderte la acción a 15€ aunque valga 20€. Por eso necesita cubrir ese riesgo — ahí es donde entran las griegas.

---

## Tema 22: Dynamic Hedging — Cobertura con Opciones

### La idea central

Cuando una institución financiera vende una opción a un cliente que no corresponde a ningún contrato estandarizado en bolsa, no puede cubrirse comprando exactamente la misma opción en el mercado. Tiene que cubrirse de forma **dinámica**: reajustando continuamente una posición en el activo subyacente para neutralizar el riesgo de la opción. El marco teórico para hacer esto son las **griegas** — un conjunto de sensibilidades que miden cómo cambia el valor de la opción ante cambios en distintos factores de mercado.


### EJEMPLO:

Piénsalo así: si vendes una opción call a alguien (le das el derecho a comprarte Repsol a 15€), y la acción sube a 25€, tienes que venderle la acción a 15€ aunque te cueste 25€ en el mercado. Pierdes 10€ por acción.

Para no estar expuesto a esa pérdida, la institución financiera **compra acciones de Repsol mientras espera**. Si tiene las acciones, cuando el cliente ejerza la opción simplemente se las entrega — no tiene que salir a comprarlas al precio alto.

El problema es que no sabe si el cliente va a ejercer o no. Si compra todas las acciones desde el principio y el precio baja a 10€, ha perdido dinero en las acciones sin necesidad. Y si no compra nada y el precio sube mucho, pierde al tener que comprarlas caras al final.

La cobertura dinámica resuelve esto comprando **una fracción** de las acciones — no todas, no ninguna. Esa fracción es exactamente la **delta**: si delta es 0.6, compras 0.6 acciones por cada opción vendida. Si el precio sube y la probabilidad de que el cliente ejerza aumenta, delta sube a 0.8 y compras más. Si el precio baja y es menos probable que se ejerza, delta baja y vendes parte.

Vas ajustando esa posición continuamente según cómo evoluciona el precio — de ahí lo de "dinámica". El objetivo es que en cualquier momento, las ganancias o pérdidas en las acciones que tienes compradas compensen exactamente las pérdidas o ganancias en la opción que vendiste.

### Las griegas

Cada griega mide una dimensión diferente del riesgo de una posición en opciones. El objetivo del gestor es mantenerlas dentro de rangos aceptables.

**Delta** ($\Delta$): sensibilidad del precio de la opción respecto al precio del subyacente. Una delta de 0.6 significa que si el subyacente sube 1€, la opción sube 0.6€. Cubrir el delta — mantenerlo en cero — es la cobertura básica. Para ello, el emisor de la call compra $\Delta$ acciones por cada opción vendida. Como delta cambia constantemente con el precio del subyacente, la cobertura requiere reajustes continuos.

**Gamma** ($\Gamma$): sensibilidad del delta respecto al precio del subyacente. Mide cuánto cambia la cobertura necesaria cuando se mueve el mercado. Una posición con gamma alta es más difícil de cubrir porque el delta se desplaza rápidamente y hay que reajustar con más frecuencia.

**Vega**: sensibilidad del precio de la opción respecto a la volatilidad implícita. Cubrir el vega requiere comprar otras opciones, no solo el subyacente. Una posición vendida en opciones tiene vega negativa: pierde valor si la volatilidad sube.

**Theta** ($\Theta$): decaimiento del valor de la opción con el paso del tiempo. Una posición corta en opciones tiene theta positivo (el tiempo juega a favor del emisor).

**Rho** ($\rho$): sensibilidad respecto al tipo de interés libre de riesgo. En general es la griega menos relevante para horizontes cortos.

### Posición descubierta vs. posición cubierta

Una **posición descubierta** (*naked*) significa no hacer nada: si la opción expira out-of-the-money, el emisor se queda la prima. Si expira in-the-money, asume la pérdida total. Una **posición cubierta** estática consiste en comprar desde el inicio el subyacente para poder entregarlo si es necesario, pero esto sobre-cubre cuando la opción no se ejerce. La cobertura dinámica con delta es el término medio: cubre el riesgo de forma continua al coste de las comisiones de reajuste.

---

## Tema 23: Trading de Volatilidad — La Sonrisa de Volatilidad

### La idea central

Black-Scholes asume que la volatilidad es constante y que los precios del subyacente siguen una distribución lognormal. Ninguna de las dos cosas se cumple en los mercados reales. Los operadores lo saben y lo ajustan: usan una volatilidad diferente para cada opción según su precio de ejercicio y su vencimiento. La representación gráfica de esta volatilidad implícita en función del precio de ejercicio se llama **sonrisa de volatilidad**.

### Opciones sobre divisas: la sonrisa simétrica

Para opciones sobre tipos de cambio, la volatilidad implícita es más alta en opciones muy dentro o muy fuera del dinero (*deep ITM/OTM*) y más baja para opciones *at-the-money*. El resultado es una curva en forma de U — la sonrisa.

Esto refleja que la distribución real de los tipos de cambio tiene **colas más pesadas** que la lognormal (mayor kurtosis): los movimientos extremos son más frecuentes de lo que el modelo predice. Los datos lo confirman: los tipos de cambio superan 3 desviaciones estándar diarias el 1.34% de los días; el modelo lognormal predice solo el 0.27%.

Las causas son dos: la volatilidad no es constante (varía a lo largo del tiempo) y los tipos de cambio sufren saltos discretos en respuesta a noticias o intervenciones de bancos centrales.

### Opciones sobre acciones: el sesgo de volatilidad

Para acciones e índices, la curva no es simétrica: la volatilidad implícita decrece a medida que aumenta el precio de ejercicio. Las opciones de venta *out-of-the-money* (puts baratas que se disparan en un crash) tienen volatilidad implícita muy alta; las calls *out-of-the-money* tienen volatilidad baja. Esto se llama **sesgo de volatilidad** (*volatility skew*), no sonrisa.

Este patrón no existía antes del crash de octubre de 1987. La explicación más directa es el **apalancamiento**: cuando el precio de una acción cae, el ratio deuda/capital sube y la acción se vuelve más arriesgada, lo que aumenta su volatilidad. Otra explicación es la **fobia a los crash**: los operadores asignan una probabilidad subjetiva mayor a desplomes extremos que la que implica la lognormal, y valoran las puts protectoras en consecuencia.

### Superficie de volatilidad

Cuando se combinan la sonrisa (variación por strike) con la **estructura de plazos de la volatilidad** (variación por vencimiento), se obtiene una **superficie de volatilidad**: una función bidimensional que da la volatilidad implícita apropiada para cualquier combinación de precio de ejercicio y plazo. Los operadores usan esta superficie como input real en la fórmula de BSM, reemplazando el supuesto de volatilidad constante por una que se ajusta al mercado.

La volatilidad implícita tiende a ser creciente con el plazo cuando las volatilidades de corto plazo están históricamente bajas (el mercado espera una reversión al alza), y decreciente cuando están altas. La sonrisa se aplana a medida que aumenta el vencimiento.

## Tema 24: Active Portfolio Management — Gestión Activa de Carteras

### La idea central

Un gestor **pasivo** replica un índice. Un gestor **activo** toma posiciones que se desvían del índice apostando a que sus señales de información generan rentabilidad adicional (**alpha**). El tema cubre tres marcos para construir portfolios activos y una forma de medir si la gestión activa añade valor.

### Treynor-Black (bottom-up)

El enfoque de Treynor-Black construye el portfolio activo desde los activos individuales hacia arriba. El analista genera señales de alpha para un subconjunto de activos (los que cree que están mal valorados). El modelo combina esas señales con el portfolio de mercado de forma óptima: pondera cada activo en el portfolio activo según su ratio alpha/riesgo idiosincrático ($\alpha_i / \sigma^2(\epsilon_i)$). El peso del portfolio activo respecto al de mercado depende de cuánto alpha total se espera y de cuánto riesgo no sistemático introduce.

Es un enfoque bottom-up porque parte de valoraciones individuales de activos y agrega hacia el portfolio.

### Black-Litterman (top-down, bayesiano)

Black-Litterman parte desde arriba: el **punto de partida son los pesos de mercado** (equilibrio CAPM), que implican un vector de rentabilidades esperadas. El gestor añade sus propias **views** — creencias sobre rentabilidades absolutas o relativas de activos o sectores — con un nivel de confianza asignado a cada una.

El modelo combina ambas fuentes mediante el **teorema de Bayes**: la distribución posterior de rentabilidades mezcla las rentabilidades de equilibrio (prior) con las views del gestor (likelihood), ponderadas por la confianza en cada una. Los pesos óptimos resultan de minimizar la varianza del portfolio sujeto a maximizar la rentabilidad esperada posterior.

La ventaja respecto a la optimización media-varianza clásica es la estabilidad: los pesos no dependen exclusivamente de las rentabilidades esperadas del analista (que tienen mucho error de estimación), sino de una combinación disciplinada con el equilibrio de mercado.

### Risk Parity

El portfolio de **riesgo paritario** asigna pesos de forma que cada activo o clase de activo **contribuya igual al riesgo total** del portfolio, en lugar de igualar los pesos de capital (1/N) o maximizar el Sharpe.

Para volatilidad como medida de riesgo, los pesos de riesgo paritario son proporcionales a la inversa de la volatilidad de cada activo (o, de forma más exacta, a la inversa de la suma de la fila correspondiente de la matriz de covarianzas). En la práctica, esto sobrepondera activos de bajo riesgo (bonos) e infrapondera activos de alto riesgo (acciones). Para alcanzar el nivel de rentabilidad de un portfolio tradicional 60/40, los fondos de risk parity suelen apalancar la parte de bonos.

La evidencia (PanAgora, Bridgewater) sugiere que outperforma para medidas de riesgo coherentes. El riesgo principal es el de estimación: si la volatilidad de un activo está subestimada, el portfolio le asigna más peso del que debería.

### Valoración de la gestión activa

El valor de la gestión activa se resume en el **ratio de información** (IR): alpha generado dividido entre el tracking error respecto al benchmark. La **ley fundamental de la gestión activa** establece que:

$$IR = IC \cdot \sqrt{BR}$$

donde $IC$ (*information coefficient*) es la correlación entre las señales del gestor y los retornos reales, y $BR$ (*breadth*) es el número de apuestas independientes al año. Un gestor con $IC$ modesto pero que opera con muchas apuestas independientes (diversificación de alpha) puede tener un IR alto. La implicación práctica: más diversificación de señales mejora el IR, incluso con habilidad moderada.

---

## Lo más importante para recordar

1. **Delta hedging es dinámico por definición.** La delta de una opción cambia continuamente con el precio del subyacente, por lo que la cobertura hay que reajustarla en cada periodo. El coste de ese reajuste es lo que el emisor "paga" por cubrir su exposición.

2. **La sonrisa de volatilidad demuestra que BSM es un modelo incompleto, no uno equivocado.** Los operadores lo usan como herramienta de interpolación: asignan la volatilidad implícita correcta para cada strike y vencimiento leyéndola de la superficie, y aplican la fórmula. El modelo sigue siendo útil como lenguaje común del mercado.

3. **El sesgo de volatilidad en acciones no existía antes de 1987.** Es un artefacto del crash: el mercado aprendió que los desplomes extremos son más probables de lo que implica la lognormal y desde entonces incorpora esa prima en las puts baratas.

4. **Black-Litterman resuelve el problema de inestabilidad de la optimización media-varianza.** Las pequeñas variaciones en las rentabilidades esperadas de entrada producen pesos óptimos radicalmente distintos. BL estabiliza el proceso anclando los pesos al equilibrio de mercado y dejando que las views del gestor los ajusten suavemente.

5. **Risk parity no es igual a mínima varianza.** Mínima varianza minimiza la volatilidad total; risk parity equilibra las contribuciones al riesgo. Son diferentes en composición y en objetivo.

6. **La ley fundamental de la gestión activa: el IR crece con la raíz del número de apuestas.** Diversificar señales (más activos, más estrategias) mejora el IR incluso sin mejorar la habilidad de cada señal individual.
